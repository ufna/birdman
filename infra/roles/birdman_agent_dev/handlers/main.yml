---
- name: Apply birdman tmpfiles
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/birdman.conf
  changed_when: true

# ВНИМАНИЕ (tracker #994): шиппер обязан перечитать конфиг РАНЬШЕ, чем агент
# перейдёт на размеченный путь логов, иначе между двумя рестартами существует
# окно, в котором дедики пишут в {project}/{env}, а старый `include` vector'а
# туда не смотрит.
#
# Хендлера «перезапусти агента» здесь БОЛЬШЕ НЕТ, и это не упрощение (#1065):
# нод на боксе несколько, у каждой свой юнит, а хендлер безадресен — он не
# знает, чья именно правка его дёрнула, и перезапускал бы весь бокс. Рестарты
# агентов делает tasks/main.yml явным списком birdman_agent_restart_pending,
# сразу ПОСЛЕ этого flush'а. Порядок «сначала vector, потом агенты» держится
# тем же самым, только теперь его видно в файле задач, а не в порядке
# определения хендлеров.
- name: Restart birdman-vector
  ansible.builtin.command:
    cmd: docker restart birdman-vector
  changed_when: true

- name: Restart birdman-node-vmagent
  ansible.builtin.command:
    cmd: docker restart birdman-node-vmagent
  changed_when: true
