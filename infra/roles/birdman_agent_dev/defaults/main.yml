---
# Дефолты дев-роли birdman-agent (итерации 0–1). Значения конфига — по
# docs/specs/agent.md §10, ужатые под общий дев-бокс (узкий порт-диапазон,
# скромные лимиты).
birdman_agent_binary: "{{ playbook_dir }}/../../agent/dist/birdman-agent"

# ── НЕСКОЛЬКО НОД BIRDMAN НА ОДНОМ БОКСЕ (tracker #1065) ─────────────────────
# Нода по-прежнему принадлежит РОВНО ОДНОМУ проекту (планировщик выбирает
# кандидатов по nodes.project_id) — меняется только то, что на одном хосте
# помещалась ровно одна нода, из-за чего новый проект на существующем железе не
# запускался вовсе. Один мощный дев-сервер несёт ноду на проект: ноды разные, с
# разным конфигом, и шарят один айпи.
#
# КЛЮЧ ПАРАМЕТРИЗАЦИИ — ИМЯ ИНСТАНСА, А НЕ ПРОЕКТ. Имя обязано стать
# уникальным именем ноды в мастере (колонка nodes.hostname), и по нему же
# суффиксуется всё остальное; а по проекту не выражается законный случай двух
# нод ОДНОГО проекта в разных окружениях на одном боксе.
#
# ПУСТОЕ ИМЯ = ЛЕГАСИ-ИНСТАНС: юнит `birdman-agent`, /etc/birdman/agent.yaml,
# /var/lib/birdman, порты 20000–20050, метрики 9101, namespace `birdman` — всё
# ровно как до этой правки, байт-в-байт. Дефолт списка — один такой инстанс,
# поэтому существующие инвентари и живые ноды прогон не замечают: конфиг не
# переименовывается, node.token не теряется, нода не регистрируется заново.
#
# Пер-инстансные ключи (любой можно не задавать — возьмётся хостовой birdman_*
# того же смысла): name, project, region, env-независимо; capacity_slots,
# port_range, limits_default, metrics_port, node_name, qos_echo, data_dir,
# log_dir, config_file, token_file, containerd_namespace, ufw_comment.
#
#   birdman_agent_instances:
#     - {}                                  # легаси-нода бокса (проект game)
#     - name: khl
#       project: khl-legends
#       capacity_slots: 4
#       port_range: [20100, 20150]
#       metrics_port: 9111
birdman_agent_instances:
  - {}

# Порт /metrics легаси-инстанса (agent.md §9, только loopback). Каждый
# следующий инстанс обязан взять СВОЙ — иначе второй агент не поднимет
# листенер, а центральный скрейп будет собирать одну ноду дважды.
birdman_agent_metrics_port: 9101
# Путь конфига легаси-инстанса; именованные получают /etc/birdman/agent-<имя>.yaml.
birdman_agent_config_file: /etc/birdman/agent.yaml

birdman_region: dev
birdman_capacity_slots: 8
birdman_port_range: [20000, 20050]
# QoS echo (ops.md §4 / docs: единственный внешне-открытый порт на ноде).
#
# ОСТАЁТСЯ ОБЩИМ НА ХОСТ и при нескольких нодах (#1065). Это не экономия, а
# корректность: эхо — безадресный байт-зеркальный UDP-респондер, он не несёт ни
# идентичности ноды, ни проекта, а меряется им сетевой путь ДО ХОСТА, одинаковый
# для всех нод бокса. Вдобавок GET /v1/qos уже сужен по (project, env) и берёт
# `select distinct region, host(public_ip)`, так что пер-нодовый порт выдал бы
# клиенту N неразличимых по RTT таргетов вместо одного и сломал бы инвариант
# «единственный внешне-открытый порт ноды».
#
# ВЛАДЕЛЬЦА КОНФИГОМ БОЛЬШЕ НЕ НАЗНАЧАЮТ (#1068): претендуют ВСЕ агенты бокса
# (`qos_echo`, по умолчанию true у каждого), порт достаётся тому, чей bind
# прошёл, а проигравший ждёт освобождения и подхватывает его за ≤5с. Раньше
# владелец был первым инстансом списка, и его смерть гасила ping-таргет бокса
# для ВСЕХ его нод, включая ноды СОСЕДНЕГО проекта, чьи агенты живы, — мастер
# продолжал отдавать им таргет, а клиент, не получив эха, выбрасывал регион из
# ранжирования целиком. Взаимозаменяемость владельца законна ровно потому, что
# респондер безадресный: кто именно отвечает — ненаблюдаемо.
#
# `qos_echo: false` у инстанса остаётся — это явный отказ отвечать на пробы
# (порт бокса принадлежит чему-то другому). Роль падает, если так сказали ВСЕМ.
birdman_qos_echo_port: 19999
birdman_limits_default:
  cpu_millis: 2000
  mem_mb: 1024
birdman_log_dir: /var/log/birdman
birdman_data_dir: /var/lib/birdman
# dual-fs watermark (environments v1 §6в): containerd data root, где живут образы
# дедиков. Пусто → строка не рендерится в agent.yaml, действует код-дефолт агента
# /var/lib/containerd. Задавать ТОЛЬКО если containerd вынесен на отдельный от
# data_dir маунт — тогда watermark-GC и birdman_agent_containerd_disk_* метрики
# видят реальную ФС образов (agent.md §6).
birdman_agent_containerd_root: ""

birdman_registry_username: ufna
birdman_registry_token_file: /etc/birdman/ghcr.token
# Хост, к которому применяется legacy-кред (registry_auth); мастерские
# реестры (Админка → Реестры) матчатся сами по своему host, независимо от
# этого значения.
birdman_registry_host: ghcr.io

# Комментарий UFW-правил — по нему находим/сверяем свои правила на общем боксе.
birdman_ufw_comment: birdman-dev

# --- master-линк (итерация 1) ---
# Master на той же тачке, только localhost (роль birdman_master_dev).
birdman_master_addr: "127.0.0.1:8444"
birdman_master_api: "http://127.0.0.1:8100"
birdman_master_admin_key_file: /etc/birdman/master-admin.key
# node_token выдаётся POST /v1/nodes при первом прогоне и живёт ТОЛЬКО на
# тачке (0600); агент читает его из файла (node_token_file в agent.yaml).
birdman_node_token_file: /etc/birdman/node.token
# Публичный CA-серт master'а (mTLS agentlink v1, дизайн §6): роль тянет его
# через GET /v1/ca и кладёт сюда 0644 (ПУБЛИЧНЫЙ серт, не секрет). Агент
# верифицирует по нему цепочку master'а + ServerName birdman-master.
birdman_master_ca_file: /etc/birdman/master-ca.pem
birdman_project: game
birdman_public_ip: "{{ ansible_host }}"

# --- vector: шиппер логов дедиков в центральный VictoriaLogs (спека логи v1) ---
birdman_vector_image: timberio/vector:0.56.0-alpine
birdman_vector_dir: /opt/birdman/vector             # compose.yml (аналог birdman_master_dir у master-роли)
# /insert — база; loki-sink vector сам допишет /loki/api/v1/push
# tracker #994: логи дедиков ложатся в подкаталоги {project}/{env} — пара едет
# в стрим-лейблы VL, master сужает по ней запрос привязанного ключа. Флаг и
# vector.yaml этой же роли обязаны ехать ВМЕСТЕ.
birdman_log_scope_dirs: true
birdman_vl_sink_url: "http://127.0.0.1:9428/insert"
birdman_vector_data_dir: /var/lib/birdman/vector   # checkpoint + disk-буфер

# --- генерализация на удалённые ноды (итерация 5, спека iter5 §3/§4) ---
# Хост инвентаря, на котором выполняются REST-вызовы master API (slurp
# admin-ключа, POST /v1/nodes, GET /v1/ca). Дефолт — сам хост (дев-бокс:
# master на той же тачке, поведение байт-в-байт прежнее). Для удалённой
# ноды = хост master-бокса: admin-ключ НЕ покидает master-бокс, REST не
# покидает его localhost.
birdman_master_api_host: "{{ inventory_hostname }}"

# --- кто владеет бинарём агента (tracker #1069, #1070) ----------------------
# По этим двум путям НА МАСТЕР-БОКСЕ ФЛОТА (birdman_master_api_host) tasks/
# binary.yml выясняет, катает ли агентов pull-деплоер: скрипт — «деплоер тут
# есть», disabled — kill-switch. Оба ставит роль birdman_devdeploy
# (tasks/main.yml: dest скрипта и файл, который она держит absent/touch по
# birdman_devdeploy_enabled) — она и есть источник правды, а совпадение путей
# закреплено тестом роли, чтобы гард не начал однажды сторожить файл, которого
# больше никто не кладёт, и не выключился молча.
birdman_devdeploy_script_path: /usr/local/bin/birdman-devdeploy
birdman_devdeploy_disabled_path: /etc/birdman/devdeploy.disabled
# Legacy-путь кредов реестра (env BIRDMAN_GHCR_TOKEN → ghcr.token →
# registry_auth в agent.yaml). Основной путь — Админка → Реестры
# (SetRegistries по mTLS-линку). false = на диске ноды нет ghcr-токена
# вообще (меньше секретов на боксе).
birdman_registry_legacy: true

# --- нодовый vmagent: пуш агентских метрик в центральный VM через оверлей
# (итерация 5.2, спека 2026-07-11-iter5-multinode-design.md §2) ---
# false = блок выключен целиком. На дев-боксе НЕ включать: его агент уже
# скрейпит центральный vmagent мониторинг-роли (иначе дубли серий).
birdman_node_vmagent: false
birdman_node_vmagent_image: victoriametrics/vmagent:v1.102.1   # пин = мониторинг-роль
birdman_node_vmagent_dir: /opt/birdman/vmagent                 # compose-проект
birdman_node_vmagent_data_dir: /var/lib/birdman/vmagent        # remote-write диск-буфер
birdman_node_vmagent_scrape_interval: 15s
# Через оверлей: форвард хаба 8428 поднят в 5.1 (решение владельца №6).
birdman_node_vm_remote_write_url: "http://10.77.0.1:8428/api/v1/write"
