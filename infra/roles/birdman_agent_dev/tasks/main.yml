---
# Всё в этой роли — аддитивно и только birdman-объекты: общий дев-бокс,
# чужие контейнеры/nginx/UFW-правила не трогаем.
# Итерация 1: агент — демон под master'ом; роль регистрирует ноду в master
# (одноразово, node_token остаётся только на тачке) и включает unit.

- name: Read GHCR token from env BIRDMAN_GHCR_TOKEN
  ansible.builtin.set_fact:
    birdman_ghcr_token: "{{ lookup('env', 'BIRDMAN_GHCR_TOKEN') }}"
  no_log: true
  when: birdman_registry_legacy

- name: Fail if BIRDMAN_GHCR_TOKEN is not exported
  ansible.builtin.fail:
    msg: >-
      env BIRDMAN_GHCR_TOKEN пуст. Экспортируй токен перед запуском
      (см. infra/README.md). Токен никогда не хранится в репо.
  when: birdman_registry_legacy and birdman_ghcr_token | length == 0

- name: Create birdman directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/birdman, mode: "0755" }
    - { path: "{{ birdman_data_dir }}", mode: "0755" }
    - { path: "{{ birdman_log_dir }}", mode: "0755" }
    - { path: "{{ birdman_log_dir }}/servers", mode: "0755" }

- name: Install tmpfiles.d config for /run/birdman (survives reboot)
  ansible.builtin.copy:
    src: tmpfiles-birdman.conf
    dest: /etc/tmpfiles.d/birdman.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply birdman tmpfiles

- name: Install birdman-agent binary
  ansible.builtin.copy:
    src: "{{ birdman_agent_binary }}"
    dest: /usr/local/bin/birdman-agent
    owner: root
    group: root
    mode: "0755"
  notify: Restart birdman-agent

# --- доставка публичного CA-серта master'а на ноду (mTLS agentlink v1, §6) ---
# Тянем на каждом прогоне (идемпотентно): покрывает и новую ноду, и ротацию CA.
# Серт ПУБЛИЧНЫЙ (ключ CA живёт только в PG master'а) → файл 0644. Тот же
# admin-ключ и механизм, что и у регистрации ноды (POST /v1/nodes ниже);
# /v1/ca — readonly-скоуп.
# ВАЖНО (порядок): CA кладём ДО шаблона agent.yaml — тот убирает tls_insecure и
# включает tls_ca_file, поэтому без master-ca.pem агент не соберёт trust pool.
# Если прогон прервётся здесь (напр. GET /v1/ca 404 против старого master'а),
# на диске остаётся старый рабочий agent.yaml (ещё с tls_insecure), и нода не
# уходит в офлайн при следующем рестарте агента. Нужен только /etc/birdman
# (создан выше), admin-ключ и доступность master API — всё уже есть.
- name: Deliver master CA cert to node (GET /v1/ca)
  block:
    - name: Read master admin key for CA fetch
      ansible.builtin.slurp:
        src: "{{ birdman_master_admin_key_file }}"
      register: birdman_admin_key_ca_slurp
      no_log: true
      delegate_to: "{{ birdman_master_api_host }}"

    - name: Fetch active CA cert bundle (text/plain PEM)
      ansible.builtin.uri:
        url: "{{ birdman_master_api }}/v1/ca"
        method: GET
        headers:
          Authorization: "Bearer {{ birdman_admin_key_ca_slurp.content | b64decode | trim }}"
        return_content: true
        status_code: 200
      register: birdman_ca_fetch
      no_log: true
      delegate_to: "{{ birdman_master_api_host }}"

    - name: Write master CA cert (0644, публичный серт — не секрет)
      ansible.builtin.copy:
        content: "{{ birdman_ca_fetch.content }}"
        dest: "{{ birdman_master_ca_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart birdman-agent

- name: Install agent config /etc/birdman/agent.yaml
  ansible.builtin.template:
    src: agent.yaml.j2
    dest: /etc/birdman/agent.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-agent

- name: Install GHCR pull token (root-only)
  ansible.builtin.copy:
    content: "{{ birdman_ghcr_token }}\n"
    dest: "{{ birdman_registry_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: birdman_registry_legacy

- name: Allow birdman dedicated-server port range in UFW (additive)
  community.general.ufw:
    rule: allow
    port: "{{ birdman_port_range[0] }}:{{ birdman_port_range[1] }}"
    proto: "{{ item }}"
    comment: "{{ birdman_ufw_comment }}"
  loop: [tcp, udp]

- name: Allow QoS echo port in UFW (additive, единственный внешне-открытый порт)
  community.general.ufw:
    rule: allow
    port: "{{ birdman_qos_echo_port }}"
    proto: udp
    comment: "{{ birdman_ufw_comment }}"

# --- регистрация ноды в master (одноразовая, идемпотентная) ---
# REST — на birdman_master_api_host (delegate_to): для дев-бокса это он сам,
# для удалённой ноды — master-бокс (admin-ключ его не покидает; спека iter5 §3).

- name: Check for stored node token
  ansible.builtin.stat:
    path: "{{ birdman_node_token_file }}"
  register: birdman_node_token_stat

- name: Register node in master (POST /v1/nodes)
  when: not birdman_node_token_stat.stat.exists
  block:
    - name: Read master admin key
      ansible.builtin.slurp:
        src: "{{ birdman_master_admin_key_file }}"
      register: birdman_admin_key_slurp
      no_log: true
      delegate_to: "{{ birdman_master_api_host }}"

    - name: Create node (one-time node_token in response)
      ansible.builtin.uri:
        url: "{{ birdman_master_api }}/v1/nodes"
        method: POST
        headers:
          Authorization: "Bearer {{ birdman_admin_key_slurp.content | b64decode | trim }}"
        body_format: json
        body:
          project: "{{ birdman_project }}"
          region: "{{ birdman_region }}"
          hostname: "{{ ansible_facts.hostname }}"
          public_ip: "{{ birdman_public_ip }}"
          capacity_slots: "{{ birdman_capacity_slots | int }}"
        status_code: 201
      register: birdman_node_reg
      no_log: true
      delegate_to: "{{ birdman_master_api_host }}"

    - name: Store node token (0600, box only)
      ansible.builtin.copy:
        content: "{{ birdman_node_reg.json.node_token }}"
        dest: "{{ birdman_node_token_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart birdman-agent

- name: Install birdman-agent.service unit
  ansible.builtin.copy:
    src: birdman-agent.service
    dest: /etc/systemd/system/birdman-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-agent

- name: Enable and start birdman-agent
  ansible.builtin.systemd_service:
    name: birdman-agent.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply tmpfiles and pending restarts
  ansible.builtin.meta: flush_handlers

# --- vector: шиппер логов дедиков в VictoriaLogs (спека логи v1) ---

- name: Create vector directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ birdman_vector_dir }}"
    - "{{ birdman_vector_data_dir }}"

- name: Install vector config /etc/birdman/vector.yaml
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: /etc/birdman/vector.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-vector

- name: Install vector docker compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ birdman_vector_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start birdman-vector (docker compose, idempotent)
  ansible.builtin.command:
    cmd: docker compose -f {{ birdman_vector_dir }}/compose.yml up -d --wait
  register: birdman_vector_compose_up
  changed_when: "'Started' in birdman_vector_compose_up.stderr or 'Created' in birdman_vector_compose_up.stderr"

- name: Apply pending vector restart
  ansible.builtin.meta: flush_handlers
