---
# Всё в этой роли — аддитивно и только birdman-объекты: общий дев-бокс,
# чужие контейнеры/nginx/UFW-правила не трогаем.
# Итерация 1: агент — демон под master'ом; роль регистрирует ноду в master
# (одноразово, node_token остаётся только на тачке) и включает unit.
#
# tracker #1065: на боксе может быть НЕСКОЛЬКО нод birdman (одна на проект) —
# см. birdman_agent_instances в defaults. Этот файл держит ХОСТОВОЕ (бинарь,
# /etc/birdman, master-CA, ghcr-токен, UDP-эхо QoS, vector, нодовый vmagent),
# tasks/instance.yml — всё пер-нодовое. Дефолтный список из одного безымянного
# инстанса даёт ровно прежний результат, поэтому живые ноды прогон не замечают.

- name: Read GHCR token from env BIRDMAN_GHCR_TOKEN
  ansible.builtin.set_fact:
    birdman_ghcr_token: "{{ lookup('env', 'BIRDMAN_GHCR_TOKEN') }}"
  no_log: true
  when: birdman_registry_legacy

# В --check гейт не стопает прогон (not ansible_check_mode): check-режим
# должен проходить насквозь и без экспортированного токена. Боевой прогон
# без токена падает как раньше.
- name: Fail if BIRDMAN_GHCR_TOKEN is not exported
  ansible.builtin.fail:
    msg: >-
      env BIRDMAN_GHCR_TOKEN пуст. Экспортируй токен перед запуском
      (см. infra/README.md). Токен никогда не хранится в репо.
  when:
    - birdman_registry_legacy
    - not ansible_check_mode
    - birdman_ghcr_token | length == 0

- name: Note that GHCR gate is bypassed in check mode
  ansible.builtin.debug:
    msg: >-
      check mode: BIRDMAN_GHCR_TOKEN не экспортирован — legacy-ghcr-гейт
      пропущен, ghcr.token не сверяется. Боевой прогон без токена упадёт.
  when:
    - birdman_registry_legacy
    - ansible_check_mode
    - birdman_ghcr_token | length == 0

# Ноды бокса разворачиваются и проверяются на столкновения ДО первой записи на
# диск: пересекающийся порт или общий каталог обязаны отказать прогон, а не
# проявиться половиной выката.
- name: Resolve and validate the box's birdman node instances
  ansible.builtin.include_tasks: instances.yml

- name: Create shared birdman directories
  ansible.builtin.file:
    path: /etc/birdman
    state: directory
    owner: root
    group: root
    mode: "0755"

# Каталог liba-сокетов у каждой ноды свой (/run/birdman<sfx>/servers): он
# бинд-маунтится ВНУТРЬ дедика, поэтому общий каталог означал бы, что дедики
# соседа видят чужие сокеты. /run — tmpfs, каталоги обязаны пересоздаваться
# после ребута, отсюда tmpfiles.d.
- name: Install tmpfiles.d config for the nodes' runtime dirs (survives reboot)
  ansible.builtin.template:
    src: tmpfiles-birdman.conf.j2
    dest: /etc/tmpfiles.d/birdman.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply birdman tmpfiles

# Бинарь агента — отдельным файлом задач (tracker #1069): у него есть гард «кто
# им владеет», симметричный мастерскому, и роль обязана уметь доказать этот
# гард ПРОГОНОМ, а не глазами. Тест играет ровно этот файл
# (tests/binary_guard.yml) — как tests/render_role.yml играет instances.yml;
# копия трёх задач в тесте разъехалась бы с ролью.
# Регистрация birdman_agent_binary_install переживает include и ниже даёт
# набор рестартов бокса.
- name: Install the agent binary unless the pull deployer owns it
  ansible.builtin.include_tasks: binary.yml

# --- доставка публичного CA-серта master'а на ноду (mTLS agentlink v1, §6) ---
# Тянем на каждом прогоне (идемпотентно): покрывает и новую ноду, и ротацию CA.
# Серт ПУБЛИЧНЫЙ (ключ CA живёт только в PG master'а) → файл 0644. Тот же
# admin-ключ и механизм, что и у регистрации ноды (POST /v1/nodes ниже);
# /v1/ca — readonly-скоуп. Серт ОБЩИЙ на бокс: у всех нод хоста один и тот же
# master.
# ВАЖНО (порядок): CA кладём ДО шаблонов agent.yaml — те убирают tls_insecure и
# включают tls_ca_file, поэтому без master-ca.pem агент не соберёт trust pool.
# Если прогон прервётся здесь (напр. GET /v1/ca 404 против старого master'а),
# на диске остаются старые рабочие agent.yaml (ещё с tls_insecure), и ноды не
# уходят в офлайн при следующем рестарте агента. Нужен только /etc/birdman
# (создан выше), admin-ключ и доступность master API — всё уже есть.
- name: Deliver master CA cert to node (GET /v1/ca)
  block:
    - name: Read master admin key for CA fetch
      ansible.builtin.slurp:
        src: "{{ birdman_master_admin_key_file }}"
      register: birdman_admin_key_ca_slurp
      no_log: true
      delegate_to: "{{ birdman_master_api_host }}"

    - name: Fetch active CA cert bundle (text/plain PEM)
      ansible.builtin.uri:
        url: "{{ birdman_master_api }}/v1/ca"
        method: GET
        headers:
          Authorization: "Bearer {{ birdman_admin_key_ca_slurp.content | b64decode | trim }}"
        return_content: true
        status_code: 200
      register: birdman_ca_fetch
      no_log: true
      delegate_to: "{{ birdman_master_api_host }}"

    # uri не поддерживает check-режим (движок его скипает) → в --check у
    # birdman_ca_fetch нет .content; в бою fetch выполняется всегда — гард
    # ничего не меняет.
    - name: Write master CA cert (0644, публичный серт — не секрет)
      ansible.builtin.copy:
        content: "{{ birdman_ca_fetch.content }}"
        dest: "{{ birdman_master_ca_file }}"
        owner: root
        group: root
        mode: "0644"
      register: birdman_master_ca_install
      when: birdman_ca_fetch is not skipped

# Второе условие — только про --check без токена: не рисовать ложный changed
# «затёр бы боевой ghcr.token пустым». В боевом прогоне пустой токен сюда не
# доходит (гейт выше) — условие тождественно прежнему.
- name: Install GHCR pull token (root-only)
  ansible.builtin.copy:
    content: "{{ birdman_ghcr_token }}\n"
    dest: "{{ birdman_registry_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: birdman_ghcr_token_install
  when:
    - birdman_registry_legacy
    - birdman_ghcr_token | length > 0 or not ansible_check_mode

# UDP-эхо QoS открыто ОДИН раз на бокс: порт общий для всех нод хоста, держит
# его тот агент бокса, кто жив — за порт состязаются все (#1068, обоснование
# целиком — birdman_qos_echo_port в defaults).
- name: Allow QoS echo port in UFW (additive, единственный внешне-открытый порт)
  community.general.ufw:
    rule: allow
    port: "{{ birdman_qos_echo_port }}"
    proto: udp
    comment: "{{ birdman_ufw_comment }}"

# --- ноды бокса ---
# Хостовые изменения (бинарь, CA, ghcr-токен) касаются ВСЕХ агентов, поэтому
# рестартуют весь бокс; пер-нодовые (конфиг, юнит, токен) — только свою ноду.
- name: Start the restart set with the nodes affected by host-wide changes
  ansible.builtin.set_fact:
    birdman_agent_restart_pending: >-
      {{ (birdman_instances | map(attribute='unit') | list)
         if (birdman_agent_binary_install.changed
             or (birdman_master_ca_install.changed | default(false))
             or (birdman_ghcr_token_install.changed | default(false)))
         else [] }}

- name: Install each birdman node of this box
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ birdman_instances }}"
  loop_control:
    loop_var: bmi
    label: "{{ bmi.node_name }} (unit {{ bmi.unit }})"

# --- vector: шиппер логов дедиков в VictoriaLogs (спека логи v1) ---
# ОДИН на бокс, а не на ноду: шиппер — хостовая сущность, и пара {project}/{env}
# едет к нему ИЗ ПУТИ файла (tracker #994), а не из того, чей это агент. Он
# просто читает объединение log-каталогов всех нод бокса.

- name: Create vector directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ birdman_vector_dir }}"
    - "{{ birdman_vector_data_dir }}"

- name: Install vector config /etc/birdman/vector.yaml
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: /etc/birdman/vector.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-vector

- name: Install vector docker compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ birdman_vector_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start birdman-vector (docker compose, idempotent)
  ansible.builtin.command:
    cmd: docker compose -f {{ birdman_vector_dir }}/compose.yml up -d --wait
  register: birdman_vector_compose_up
  changed_when: "'Started' in birdman_vector_compose_up.stderr or 'Created' in birdman_vector_compose_up.stderr or 'Recreated' in birdman_vector_compose_up.stderr"

# Агенты стартуют/рестартуют ПОСЛЕ того, как vector получил свой конфиг
# (tracker #994). Порядок несущий: `log_scope_dirs` в agent.yaml переводит
# дедики на путь {project}/{env}, а старый `include` шиппера этот путь не видит
# — рестарт агента раньше конфига vector'а оставлял бы ноду в окне «агент
# размечает, шиппер не видит», и, оборвись прогон в этом окне (таймаут
# `--wait`, отказ pull), окно жило бы до следующего ручного прогона. Тот же
# аргумент теперь и про НОВУЮ ноду бокса: её log_dir появляется в конфиге
# шиппера здесь, и только после этого её агенту разрешено писать.
- name: Apply tmpfiles and the vector restart (агенты — после конфига vector'а)
  ansible.builtin.meta: flush_handlers

- name: Enable and start each birdman node's agent
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ birdman_instances | map(attribute='unit') | list }}"

# Рестарт — ТОЛЬКО тем нодам, у которых что-то изменилось. Соседняя нода
# бокса при повторном прогоне по одной не перезапускается вовсе: это отдельное
# требование приёмки #1065 («идемпотентность по каждой ноде»), и общий хендлер
# «перезапусти все агенты» его бы не выполнял.
- name: Restart the birdman nodes whose material changed
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ birdman_agent_restart_pending | unique }}"

# --- нодовый vmagent: метрики агентов в центральный VM через оверлей (5.2).
# Тоже ОДИН на бокс: скрейпит по джобу на каждую ноду хоста (свой порт метрик,
# свои лейблы node/region). Гейт birdman_node_vmagent: на дев-боксе false
# (центральный vmagent уже скрейпит его агентов — сайдкар дал бы дубли серий). ---

- name: Create node vmagent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ birdman_node_vmagent_dir }}"
    - "{{ birdman_node_vmagent_data_dir }}"
  when: birdman_node_vmagent | default(false) | bool

- name: Install node vmagent config /etc/birdman/vmagent.yaml
  ansible.builtin.template:
    src: vmagent.yaml.j2
    dest: /etc/birdman/vmagent.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-node-vmagent
  when: birdman_node_vmagent | default(false) | bool

- name: Install node vmagent compose file
  ansible.builtin.template:
    src: vmagent-compose.yml.j2
    dest: "{{ birdman_node_vmagent_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  when: birdman_node_vmagent | default(false) | bool

- name: Start birdman-node-vmagent (docker compose, идемпотентно)
  ansible.builtin.command:
    cmd: docker compose -f {{ birdman_node_vmagent_dir }}/compose.yml up -d --wait
  register: birdman_node_vmagent_up
  changed_when: "'Started' in birdman_node_vmagent_up.stderr or 'Created' in birdman_node_vmagent_up.stderr or 'Recreated' in birdman_node_vmagent_up.stderr"
  when: birdman_node_vmagent | default(false) | bool

- name: Apply pending node vmagent restart
  ansible.builtin.meta: flush_handlers
