# Дев-роль наблюдаемости + ops (итерация 4). Всё аддитивно и только
# birdman-объекты (общий дев-бокс): свой compose-проект birdman-monitoring,
# свои файлы в /etc/birdman/monitoring, свои systemd-юниты бэкапа.
- name: Monitoring stack (VictoriaMetrics + vmagent + vmalert + Grafana + alert sink)
