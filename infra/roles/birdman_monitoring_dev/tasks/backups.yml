---
# Бэкапы Postgres: с Backups v1 (spec 2026-07-13) их исполняет сам master
# (планировщик+pg_dump+ротация+S3, настройка в панели). Здесь остались:
#   - каталог дампов (master пишет туда же, формат имён тот же),
#   - restore-drill скрипт birdman-pg-restore-test,
#   - СНОС старого systemd-таймера (идемпотентно; на свежем боксе - no-op).

- name: Ensure backups dir
  ansible.builtin.file:
    path: "{{ birdman_backups_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install restore-drill script
  ansible.builtin.template:
    src: birdman-pg-restore-test.sh.j2
    dest: /usr/local/bin/birdman-pg-restore-test
    owner: root
    group: root
    mode: "0755"

# --- снос legacy-таймера (Backups v1) ---

- name: Stop and disable legacy backup timer (if present)
  ansible.builtin.systemd_service:
    name: birdman-pg-backup.timer
    state: stopped
    enabled: false
  failed_when: false

- name: Remove legacy backup units and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/birdman-pg-backup.timer
    - /etc/systemd/system/birdman-pg-backup.service
    - /usr/local/bin/birdman-pg-backup
  notify: Reload systemd daemon
