---
# Стек наблюдаемости birdman: docker compose (проект birdman-monitoring).
# Конфиги шаблонятся в /etc/birdman/monitoring и монтируются ro в контейнеры.

# ДО обоих рендеров (scrape.yml и rules.yml ниже) — они читают уже дополненный
# birdman_scrape_jobs.
- name: Derive the scrape jobs of this box's birdman nodes
  ansible.builtin.include_tasks: scrape_jobs.yml

- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/birdman
    - /opt/birdman
    - "{{ birdman_monitoring_dir }}"
    - "{{ birdman_monitoring_conf_dir }}"
    - "{{ birdman_monitoring_conf_dir }}/vmagent"
    - "{{ birdman_monitoring_conf_dir }}/vmalert"
    - "{{ birdman_monitoring_conf_dir }}/grafana"
    - "{{ birdman_monitoring_conf_dir }}/grafana/provisioning"
    - "{{ birdman_monitoring_conf_dir }}/grafana/provisioning/datasources"
    - "{{ birdman_monitoring_conf_dir }}/grafana/provisioning/dashboards"
    - "{{ birdman_monitoring_conf_dir }}/grafana/dashboards"
    - "{{ birdman_log_dir }}"

# --- Grafana admin password: генерится один раз, живёт 0600 на тачке ---
- name: Generate Grafana admin password once (kept only on the box)
  ansible.builtin.copy:
    content: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    dest: "{{ birdman_grafana_admin_password_file }}"
    force: false          # только если файла ещё нет — идемпотентно
    owner: root
    group: root
    mode: "0600"
  no_log: true

# read-before-create: slurp/set_fact/grafana.env ниже читают пароль из файла,
# который создаёт copy выше (force:false). В --check на свежем боксе copy файл
# НЕ материализует → slurp честно падает («file not found»), каскадом валя
# set_fact и рендер grafana.env. stat-проба + гард `not ansible_check_mode or
# exists` пускают --check насквозь: в бою not ansible_check_mode тождественно
# истинно (файл к тому же только что создан) → семантика неизменна; только
# --check на свежем боксе мягко скипает чтение и рендер env_file. compose.yml
# мониторинга пароль не дереференсит (env_file 0600) — вне каскада.
- name: Probe Grafana admin password file (check-mode fresh-box guard)
  ansible.builtin.stat:
    path: "{{ birdman_grafana_admin_password_file }}"
  register: birdman_grafana_pass_stat

- name: Read Grafana admin password
  ansible.builtin.slurp:
    src: "{{ birdman_grafana_admin_password_file }}"
  register: birdman_grafana_pass_raw
  no_log: true
  when: not ansible_check_mode or birdman_grafana_pass_stat.stat.exists

- name: Set Grafana admin password fact
  ansible.builtin.set_fact:
    birdman_grafana_admin_password: "{{ birdman_grafana_pass_raw.content | b64decode | trim }}"
  no_log: true
  when: not ansible_check_mode or birdman_grafana_pass_stat.stat.exists

- name: Note that Grafana provisioning is bypassed on a fresh box in check mode
  ansible.builtin.debug:
    msg: >-
      check mode: файла admin-пароля Grafana ещё нет (свежий бокс) — чтение
      пароля и рендер grafana.env пропущены (пароль не материализован под
      --check). Боевой прогон создаёт пароль и рендерит env_file как обычно.
  when:
    - ansible_check_mode
    - not birdman_grafana_pass_stat.stat.exists

- name: Render Grafana env_file (0600, contains admin password)
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ birdman_monitoring_conf_dir }}/grafana.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart birdman-grafana
  when: not ansible_check_mode or birdman_grafana_pass_stat.stat.exists

# --- Grafana provisioning: datasource + dashboards ---
- name: Render Grafana datasource provisioning (VictoriaMetrics)
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ birdman_monitoring_conf_dir }}/grafana/provisioning/datasources/victoriametrics.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-grafana

- name: Install Grafana dashboards provider
  ansible.builtin.copy:
    src: grafana-dashboard-provider.yml
    dest: "{{ birdman_monitoring_conf_dir }}/grafana/provisioning/dashboards/provider.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-grafana

- name: Install Grafana dashboards (Тачка + birdman)
  ansible.builtin.copy:
    src: "dashboards/{{ item }}"
    dest: "{{ birdman_monitoring_conf_dir }}/grafana/dashboards/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - tachka.json
    - birdman.json
  # дашборды grafana подхватывает сама (updateIntervalSeconds) — рестарт не нужен

# --- vmagent scrape config ---
- name: Render vmagent scrape config
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ birdman_monitoring_conf_dir }}/vmagent/scrape.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-vmagent

# --- vmalert rules ---
- name: Render vmalert rules
  ansible.builtin.template:
    src: rules.yml.j2
    dest: "{{ birdman_monitoring_conf_dir }}/vmalert/rules.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-vmalert

# --- alert sink: постоянный webhook-receiver alertmanager'а (история панели) ---
- name: Install alert logger sink script
  ansible.builtin.copy:
    src: alert-logger.py
    dest: "{{ birdman_monitoring_conf_dir }}/alert-logger.py"
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-alert-sink

# --- ротация alerts.log (tracker #1073) ---
# Потолка у файла не было вовсе: 498 МБ за два часа доальтертменеджерного
# темпа. Пакет logrotate роль НЕ ставит (общий дев-бокс, кладём только
# birdman-объекты) — но и молчать о его отсутствии нельзя: конфиг, который
# некому исполнить, это ровно та же тишина, из-за которой карточка и заведена.
- name: Probe that something will actually run logrotate
  ansible.builtin.shell: |
    set -u
    command -v logrotate >/dev/null 2>&1 || { echo no-binary; exit 0; }
    if [ -x /etc/cron.daily/logrotate ] \
      || systemctl is-enabled logrotate.timer >/dev/null 2>&1; then
      echo ok
    else
      echo no-schedule
    fi
  register: birdman_logrotate_probe
  changed_when: false
  check_mode: false

- name: Refuse to pretend the rotation is configured when nothing will run it
  ansible.builtin.assert:
    that: birdman_logrotate_probe.stdout | trim == "ok"
    fail_msg: >-
      проба вернула «{{ birdman_logrotate_probe.stdout | trim }}»:
      no-binary — logrotate на боксе нет (apt-get install logrotate);
      no-schedule — logrotate есть, но его никто не запускает (нет
      /etc/cron.daily/logrotate и выключен logrotate.timer). И в том, и в другом
      случае /etc/logrotate.d/birdman-alerts лёг бы мёртвым грузом, а
      {{ birdman_alerts_log }} рос бы без потолка — молча, ровно как до
      tracker #1073.

- name: Install logrotate policy for the alerts log
  ansible.builtin.template:
    src: logrotate-alerts.j2
    dest: /etc/logrotate.d/birdman-alerts
    owner: root
    group: root
    mode: "0644"

# --- alertmanager: безусловное звено доставки (tracker #238); конфиг всегда
#     0600+no_log — при заданном birdman_alert_discord_webhook содержит секрет ---
- name: Ensure alertmanager config dir
  ansible.builtin.file:
    path: "{{ birdman_monitoring_conf_dir }}/alertmanager"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Владелец — uid КОНТЕЙНЕРА, а не root (tracker #1072). Файл монтируется ro в
# alertmanager, который бежит от nobody, а 0600 root:root даёт ему «open
# /etc/alertmanager/alertmanager.yml: permission denied» — то есть контейнер
# вообще не стартует, а вместе с ним не работает всё звено доставки, и молча.
# 0600 при этом остаётся: секрет webhook'а не должен становиться мирочитаемым,
# а root файл читает и так. Почему uid вынесен в переменную — defaults/main.yml.
- name: Render alertmanager config (0600, owned by the container's uid)
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ birdman_monitoring_conf_dir }}/alertmanager/alertmanager.yml"
    owner: "{{ birdman_alertmanager_uid }}"
    group: "{{ birdman_alertmanager_uid }}"
    mode: "0600"
  no_log: true
  notify: Restart birdman-alertmanager

# --- compose file + up ---
- name: Install monitoring compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ birdman_monitoring_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"          # без секретов: пароль Grafana — в env_file 0600

- name: Start monitoring stack (docker compose, idempotent)
  ansible.builtin.command:
    cmd: docker compose -f {{ birdman_monitoring_dir }}/compose.yml up -d --remove-orphans
  register: birdman_mon_compose_up
  changed_when: >-
    'Started' in birdman_mon_compose_up.stderr or
    'Created' in birdman_mon_compose_up.stderr or
    'Recreated' in birdman_mon_compose_up.stderr

- name: Apply pending monitoring restarts before health checks
  ansible.builtin.meta: flush_handlers

- name: Wait for VictoriaMetrics
  ansible.builtin.uri:
    url: "http://{{ birdman_bind_addr }}:{{ birdman_vm_port }}/health"
    status_code: 200
  register: birdman_vm_health
  retries: 30
  delay: 2
  until: birdman_vm_health.status == 200

- name: Wait for Grafana
  ansible.builtin.uri:
    url: "http://{{ birdman_bind_addr }}:{{ birdman_grafana_port }}/api/health"
    status_code: 200
  register: birdman_grafana_health
  retries: 30
  delay: 2
  until: birdman_grafana_health.status == 200
