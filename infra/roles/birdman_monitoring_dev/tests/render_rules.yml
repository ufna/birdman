---
# Рендер правил vmalert, скрейп-конфига и compose-файла этой роли — локально,
# без хоста и без плейбука. Переменные берутся ТОЛЬКО из defaults/main.yml
# роли: правила обязаны быть валидны с теми порогами, которые оператор получает
# до любых override'ов.
#
# Играется настоящим ansible'ом, а не переписанным рендерером (tracker #1065):
# список джобов скрейпа больше не константа в defaults, он ВЫВОДИТСЯ из нод
# бокса (tasks/scrape_jobs.yml), и из того же списка рендерится цепочка
# absent_over_time в ScrapeTargetMissing. Копия деривации в тестовом скрипте
# была бы ровно тем расхождением «правило сторожит не то, что скрейпится»,
# ради которого #1061 и заведён.
- name: Render birdman_monitoring_dev rules + scrape config
  hosts: birdman-dev
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_facts:
      hostname: birdman-dev
  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../defaults/main.yml"

    - name: Apply the box under test
      ansible.builtin.set_fact:
        birdman_agent_instances: "{{ birdman_box_instances | default(birdman_agent_instances) }}"

    - name: Derive the scrape jobs (the role's own task file)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/scrape_jobs.yml"

    # compose.yml здесь же (tracker #1072): маунты конфигов в контейнеры
    # проверяет mounted_config_access.py, и брать их он обязан из НАСТОЯЩЕГО
    # рендера — в шаблоне пути собраны из переменных, а разбирать j2 глазами
    # или регулярками значило бы завести вторую правду о раскладке.
    - name: Render rules, scrape config and the compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ item }}.j2"
        dest: "{{ birdman_out }}/{{ item }}"
        mode: "0644"
      loop:
        - rules.yml
        - scrape.yml
        - compose.yml
        # logrotate-политика alerts.log (tracker #1073): её гоняет НАСТОЯЩИЙ
        # logrotate в одноразовом контейнере — конфиг с опечаткой не ротирует
        # молча, а «проверено глазами» здесь стоило бы 498 МБ.
        - logrotate-alerts
