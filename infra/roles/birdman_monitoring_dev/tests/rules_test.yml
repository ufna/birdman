# promtool unit tests for the vmalert rules of birdman_monitoring_dev.
# Run: ./run.sh (renders rules.yml.j2 with the role defaults, no host touched).
#
# The subject is tracker #960: an alert that is PRESENT in the rules and cannot
# fire is worse than a missing one — everyone believes the case is covered.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # --- BufferEmptyReady: the dead-alert mechanism (#960) ---

  # WITNESS of the defect. A prod fleet with servers but ZERO ready ones: the
  # master emits a grouped COUNT, so the ready series does not exist at all,
  # and `sum by (region, project) (...) == 0` yields an EMPTY result — not 0.
  # This case is here so that removing the explicit zeros (master
  # metrics.go, collectReadyZeros) visibly turns the alert back into a corpse.
  - interval: 1m
    name: 'ready series ABSENT — the alert cannot fire (why explicit zeros exist)'
    input_series:
      - series: 'birdman_servers{project="game",env="prod",production="true",state="allocated",region="eu",version="1.0.0"}'
        values: '3+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BufferEmptyReadyProd
        exp_alerts: []

  # THE FIX. Same fleet, now with the explicit zero the master emits for every
  # fleet_config with buffer_ready > 0 — the alert fires.
  - interval: 1m
    name: 'explicit ready zero — BufferEmptyReadyProd fires (critical)'
    input_series:
      - series: 'birdman_servers{project="game",env="prod",production="true",state="allocated",region="eu",version="1.0.0"}'
        values: '3+0x10'
      - series: 'birdman_servers{project="game",env="prod",production="true",state="ready",region="eu",version="1.0.0"}'
        values: '0+0x10'
    alert_rule_test:
      # for: 3m — nothing before the threshold, firing after it.
      - eval_time: 2m
        alertname: BufferEmptyReadyProd
        exp_alerts: []
      - eval_time: 6m
        alertname: BufferEmptyReadyProd
        exp_alerts:
          - exp_labels:
              severity: critical
              project: game
              env: prod
              region: eu
            exp_annotations:
              summary: 'BufferEmpty(prod): проект game, окружение prod, регион eu без ready-серверов'
              description: 'sum(birdman_servers{state="ready", production="true"}) == 0 for a (region, project, env) triple for longer than the threshold (ops.md §1 BufferEmpty). Grouping by env is required: one production slice of a project may hold several environments in the same region, and an empty buffer in one would be masked by servers of another.'
              description_ru: 'sum(birdman_servers{state="ready", production="true"}) == 0 по тройке (регион, проект, окружение) дольше порога (ops.md §1 BufferEmpty). Окружение в группировке обязательно: внутри одного production-среза у проекта их может быть несколько в одном регионе, и пустой буфер одного маскировался бы серверами другого.'

  # The non-prod twin of the pair — warning, not critical.
  - interval: 1m
    name: 'explicit ready zero — BufferEmptyReadyNonProd fires (warning)'
    input_series:
      - series: 'birdman_servers{project="game",env="dev",production="false",state="ready",region="eu",version="1.0.0"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BufferEmptyReadyNonProd
        exp_alerts:
          - exp_labels:
              severity: warning
              project: game
              env: dev
              region: eu
            exp_annotations:
              summary: 'BufferEmpty(non-prod): проект game, окружение dev, регион eu без ready-серверов'
              description: 'sum(birdman_servers{state="ready", production="false"}) == 0 for a (region, project, env) triple for longer than the threshold (ops.md §1 BufferEmpty). Grouping by env is required: dev and staging share the production=false slice, and an empty ready buffer in one would be masked by servers of the other.'
              description_ru: 'sum(birdman_servers{state="ready", production="false"}) == 0 по тройке (регион, проект, окружение) дольше порога (ops.md §1 BufferEmpty). Окружение в группировке обязательно: dev и staging живут в одном срезе production=false, и пустой ready-буфер одного маскировался бы серверами другого.'
      # ...and the prod twin stays silent on a non-prod fleet.
      - eval_time: 6m
        alertname: BufferEmptyReadyProd
        exp_alerts: []

  # A warm buffer that is actually warm must never page.
  - interval: 1m
    name: 'ready > 0 — silence'
    input_series:
      - series: 'birdman_servers{project="game",env="prod",production="true",state="ready",region="eu",version="1.0.0"}'
        values: '2+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BufferEmptyReadyProd
        exp_alerts: []

  # Project scoping (#955) — correct all along, but LATENT until the zeros
  # above made the alert able to fire at all: an empty buffer of project "a"
  # must not be masked by servers of project "b" in the same region.
  - interval: 1m
    name: 'per-project buffers do not mask each other'
    input_series:
      - series: 'birdman_servers{project="a",env="prod",production="true",state="ready",region="eu",version="1.0.0"}'
        values: '0+0x10'
      - series: 'birdman_servers{project="b",env="prod",production="true",state="ready",region="eu",version="1.0.0"}'
        values: '5+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BufferEmptyReadyProd
        exp_alerts:
          - exp_labels:
              severity: critical
              project: a
              env: prod
              region: eu
            exp_annotations:
              summary: 'BufferEmpty(prod): проект a, окружение prod, регион eu без ready-серверов'
              description: 'sum(birdman_servers{state="ready", production="true"}) == 0 for a (region, project, env) triple for longer than the threshold (ops.md §1 BufferEmpty). Grouping by env is required: one production slice of a project may hold several environments in the same region, and an empty buffer in one would be masked by servers of another.'
              description_ru: 'sum(birdman_servers{state="ready", production="true"}) == 0 по тройке (регион, проект, окружение) дольше порога (ops.md §1 BufferEmpty). Окружение в группировке обязательно: внутри одного production-среза у проекта их может быть несколько в одном регионе, и пустой буфер одного маскировался бы серверами другого.'

  # --- The same class next door: increase() over a series born at 1 ---

  # WITNESS. birdman_events_total{kind} is DB-derived, so the series of a kind
  # that never happened does not exist and springs into being reading 1 —
  # increase() over a constant 1 is 0, so the FIRST crash_loop ever was
  # invisible and CrashLoop only fired from the second one on.
  - interval: 1m
    name: 'events counter born at 1 — the first event of a kind is invisible'
    input_series:
      - series: 'birdman_events_total{kind="crash_loop",project="game"}'
        values: '_ _ 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: CrashLoop
        exp_alerts: []
      - eval_time: 6m
        alertname: CrashLoop
        exp_alerts: []

  # THE FIX: the master keeps a 0 baseline for the alert-feeding kinds
  # (metrics.go, alertEventKinds), so the first event rises from it.
  - interval: 1m
    name: 'zero baseline — the first crash_loop fires'
    input_series:
      - series: 'birdman_events_total{kind="crash_loop",project="game"}'
        values: '0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: CrashLoop
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: crash_loop
              project: game
            exp_annotations:
              summary: 'CrashLoop: проект game, событий crash_loop за 5м: 1'
              description: 'A bad release is likely — roll back (ops.md §6 runbook 3).'
              description_ru: 'Вероятен плохой релиз — rollback (ops.md §6 runbook 3).'

  # --- TickDegraded: the project label arrives by JOIN, and the join hides
  # nothing (tracker #958) ---

  # The agent emits birdman_server_tick_ms{server_id} and nothing else — it does
  # not know which project a dedik belongs to. The master's reference series
  # birdman_server_info supplies the owner, and group_left copies it onto the
  # alert: this is the whole point of the card.
  - interval: 1m
    name: 'TickDegraded inherits project from birdman_server_info'
    input_series:
      - series: 'birdman_server_tick_ms{server_id="srv-a",node="node-1",region="eu"}'
        values: '80+0x10'
      - series: 'birdman_server_info{server_id="srv-a",project="arena",env="prod"}'
        values: '1+0x10'
    alert_rule_test:
      # for: 5m — silent before the threshold.
      - eval_time: 4m
        alertname: TickDegraded
        exp_alerts: []
      - eval_time: 6m
        alertname: TickDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              server_id: srv-a
              node: node-1
              region: eu
              project: arena
            exp_annotations:
              summary: 'TickDegraded: проект arena, server srv-a tick=80ms'
              description: 'game-health: server tick has been degraded for longer than the threshold (ops.md §1 TickDegraded). The project label is joined from birdman_server_info; without a match the alert stays platform-scoped.'
              description_ru: 'game-health: тик деградировал дольше порога (ops.md §1 TickDegraded). Лейбл project доклеивается join''ом с birdman_server_info; без совпадения алерт остаётся платформенным.'

  # THE NON-HIDING GUARANTEE. The info series is missing (master down, DB
  # hiccup, a dedik unknown to the database) — a plain `group_left` join would
  # SILENTLY DROP the sample and the degradation would vanish from the screen.
  # The second branch keeps it firing, just without the project label, i.e. as a
  # platform alert visible under every ?project= filter. Deleting that branch
  # turns this case red.
  - interval: 1m
    name: 'no birdman_server_info — TickDegraded still fires, platform-scoped'
    input_series:
      - series: 'birdman_server_tick_ms{server_id="srv-a",node="node-1",region="eu"}'
        values: '80+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TickDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              server_id: srv-a
              node: node-1
              region: eu
            exp_annotations:
              summary: 'TickDegraded: server srv-a tick=80ms'
              description: 'game-health: server tick has been degraded for longer than the threshold (ops.md §1 TickDegraded). The project label is joined from birdman_server_info; without a match the alert stays platform-scoped.'
              description_ru: 'game-health: тик деградировал дольше порога (ops.md §1 TickDegraded). Лейбл project доклеивается join''ом с birdman_server_info; без совпадения алерт остаётся платформенным.'

  # Scoping actually SEPARATES the projects: the degraded dedik of project "a"
  # must not be reported as project "b", and the healthy dedik of "b" must not
  # alert at all. This is what the alert screen's ?project= narrowing buys.
  - interval: 1m
    name: 'two projects — each degraded dedik carries its own project'
    input_series:
      - series: 'birdman_server_tick_ms{server_id="srv-a",node="node-1",region="eu"}'
        values: '80+0x10'
      - series: 'birdman_server_tick_ms{server_id="srv-b",node="node-2",region="eu"}'
        values: '16+0x10'
      - series: 'birdman_server_info{server_id="srv-a",project="a",env="prod"}'
        values: '1+0x10'
      - series: 'birdman_server_info{server_id="srv-b",project="b",env="prod"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TickDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              server_id: srv-a
              node: node-1
              region: eu
              project: a
            exp_annotations:
              summary: 'TickDegraded: проект a, server srv-a tick=80ms'
              description: 'game-health: server tick has been degraded for longer than the threshold (ops.md §1 TickDegraded). The project label is joined from birdman_server_info; without a match the alert stays platform-scoped.'
              description_ru: 'game-health: тик деградировал дольше порога (ops.md §1 TickDegraded). Лейбл project доклеивается join''ом с birdman_server_info; без совпадения алерт остаётся платформенным.'

  # Two info series for ONE server_id (two masters, or one master scraped by two
  # jobs) is a many-to-one duplicate: without `max by (server_id, project)` the
  # whole expression errors out with "multiple matches for labels" and the rule
  # dies — the worst kind of silent failure. The aggregation collapses them, so
  # exactly one alert comes out.
  - interval: 1m
    name: 'duplicate birdman_server_info — one alert, not a broken rule'
    input_series:
      - series: 'birdman_server_tick_ms{server_id="srv-a",node="node-1",region="eu"}'
        values: '80+0x10'
      - series: 'birdman_server_info{server_id="srv-a",project="arena",env="prod",instance="master-1"}'
        values: '1+0x10'
      - series: 'birdman_server_info{server_id="srv-a",project="arena",env="prod",instance="master-2"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TickDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              server_id: srv-a
              node: node-1
              region: eu
              project: arena
            exp_annotations:
              summary: 'TickDegraded: проект arena, server srv-a tick=80ms'
              description: 'game-health: server tick has been degraded for longer than the threshold (ops.md §1 TickDegraded). The project label is joined from birdman_server_info; without a match the alert stays platform-scoped.'
              description_ru: 'game-health: тик деградировал дольше порога (ops.md §1 TickDegraded). Лейбл project доклеивается join''ом с birdman_server_info; без совпадения алерт остаётся платформенным.'

  # A healthy tick with a matching info series must stay silent — the join must
  # not turn `> threshold` into "anything that has an owner".
  - interval: 1m
    name: 'tick below the threshold — silence despite a matching info series'
    input_series:
      - series: 'birdman_server_tick_ms{server_id="srv-a",node="node-1",region="eu"}'
        values: '16+0x10'
      - series: 'birdman_server_info{server_id="srv-a",project="arena",env="prod"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TickDegraded
        exp_alerts: []

  - interval: 1m
    name: 'zero baseline — the first agent_upgrade_failed fires'
    input_series:
      - series: 'birdman_events_total{kind="agent_upgrade_failed",project="game"}'
        values: '0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: AgentUpgradeFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: agent_upgrade_failed
              project: game
            exp_annotations:
              summary: 'AgentUpgradeFailed: проект game, неудачных апгрейдов агента за 10м: 1'
              description: 'Agent did not come back online with the new version (agent.md §7; rollback via ansible).'
              description_ru: 'Агент не вышел на связь с новой версией (agent.md §7; откат — ansible).'

  # tracker #967: два окружения одного проекта в ОДНОМ регионе и одном
  # production-срезе. Пустой ready-буфер dev обязан зажечь алерт, даже когда
  # staging полон: до сужения по env сумма по (region, project) была > 0, и
  # дежурный не узнавал о голом окружении вообще.
  - interval: 1m
    name: 'два окружения в одном регионе — пустой dev не маскируется полным staging'
    input_series:
      - series: 'birdman_servers{project="game",env="dev",production="false",state="ready",region="eu",version="1.0.0"}'
        values: '0+0x10'
      - series: 'birdman_servers{project="game",env="staging",production="false",state="ready",region="eu",version="1.0.0"}'
        values: '3+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BufferEmptyReadyNonProd
        exp_alerts:
          - exp_labels:
              severity: warning
              project: game
              env: dev
              region: eu
            exp_annotations:
              summary: 'BufferEmpty(non-prod): проект game, окружение dev, регион eu без ready-серверов'
              description: 'sum(birdman_servers{state="ready", production="false"}) == 0 for a (region, project, env) triple for longer than the threshold (ops.md §1 BufferEmpty). Grouping by env is required: dev and staging share the production=false slice, and an empty ready buffer in one would be masked by servers of the other.'
              description_ru: 'sum(birdman_servers{state="ready", production="false"}) == 0 по тройке (регион, проект, окружение) дольше порога (ops.md §1 BufferEmpty). Окружение в группировке обязательно: dev и staging живут в одном срезе production=false, и пустой ready-буфер одного маскировался бы серверами другого.'

  # tracker #966: счётчик отказов аллокации живёт в памяти процесса, поэтому без
  # пре-инициализации серия рождалась сразу со значением 1 — increase() по ней
  # даёт 0, и ПЕРВЫЙ отказ (а после каждого рестарта master — снова первый)
  # алерт не видел.
  #
  # Шаг 30с намеренно: окно правила [1m], и при шаге 1м в него попадала бы одна
  # точка, по которой increase() не считается вовсе. Проверяем на целой минуте —
  # правила вычисляются на границах интервала группы.
  - interval: 30s
    name: 'первый отказ аллокации виден только с нулевой базой'
    input_series:
      # БЕЗ пре-инициализации: серия родилась со значением 1 — роста нет.
      - series: 'birdman_allocation_failures_total{reason="no_capacity",project="lonely"}'
        values: '_ _ 1 1 1 1 1 1'
      # С нулевой базой: 0 → 1, рост виден.
      - series: 'birdman_allocation_failures_total{reason="no_capacity",project="game"}'
        values: '0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: BufferEmptyAllocFail
        exp_alerts:
          - exp_labels:
              severity: critical
              project: game
              reason: no_capacity
            exp_annotations:
              summary: 'BufferEmpty: проект game, no_capacity аллокаций за 1м: 1'
              description: 'No free slots available for allocation (ops.md §1 BufferEmpty).'
              description_ru: 'Нет свободных слотов под аллокацию (ops.md §1 BufferEmpty).'

  # tracker #986 (эпик #968): CrashLoop и AgentUpgradeFailed были платформенными
  # — падающий в цикле дедик проекта А будил дежурного проекта Б, и по алерту
  # нельзя было понять, чей проект страдает. Теперь серия несёт project, и алерт
  # наследует его сам.
  - interval: 1m
    name: 'crash_loop проекта А не приходит от имени проекта Б'
    input_series:
      - series: 'birdman_events_total{kind="crash_loop",project="alpha"}'
        values: '0 0 1 1 1 1 1 1'
      # У соседа тишина — его нулевая база существует ровно для того, чтобы
      # increase() не выдумывал ему чужой рост.
      - series: 'birdman_events_total{kind="crash_loop",project="beta"}'
        values: '0 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 4m
        alertname: CrashLoop
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: crash_loop
              project: alpha
            exp_annotations:
              summary: 'CrashLoop: проект alpha, событий crash_loop за 5м: 1'
              description: 'A bad release is likely — roll back (ops.md §6 runbook 3).'
              description_ru: 'Вероятен плохой релиз — rollback (ops.md §6 runbook 3).'

  # Платформенная половина: событие, не принадлежащее проекту (пустой лейбл),
  # обязано будить по-прежнему — иначе сужение превратилось бы в глухоту.
  - interval: 1m
    name: 'платформенный crash_loop (пустой проект) продолжает гореть'
    input_series:
      - series: 'birdman_events_total{kind="crash_loop",project=""}'
        values: '0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: CrashLoop
        exp_alerts:
          # Пустой лейбл Prometheus не хранит вовсе — в ожиданиях его нет, и
          # именно так платформенное событие отличается от проектного.
          - exp_labels:
              severity: critical
              kind: crash_loop
            exp_annotations:
              summary: 'CrashLoop: проект , событий crash_loop за 5м: 1'
              description: 'A bad release is likely — roll back (ops.md §6 runbook 3).'
              description_ru: 'Вероятен плохой релиз — rollback (ops.md §6 runbook 3).'
