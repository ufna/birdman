---
# Изменённый bind-mount конфиг сам по себе НЕ пересоздаёт контейнер (compose up
# не видит смену содержимого файла) — точечно рестартим нужный сервис.
# failed_when:false — контейнера может ещё не быть (первый прогон роли:
# handler нотифицирован до compose up): тогда рестарт — безобидный no-op.
- name: Restart birdman-vmagent
  ansible.builtin.command: docker restart birdman-vmagent
  changed_when: true
  failed_when: false

- name: Restart birdman-vmalert
  ansible.builtin.command: docker restart birdman-vmalert
  changed_when: true
  failed_when: false

- name: Restart birdman-grafana
  ansible.builtin.command: docker restart birdman-grafana
  changed_when: true
  failed_when: false

- name: Restart birdman-alert-sink
  ansible.builtin.command: docker restart birdman-alert-sink
  changed_when: true
  failed_when: false

- name: Restart birdman-alertmanager
  ansible.builtin.command: docker restart birdman-alertmanager
  changed_when: true
  failed_when: false

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true
