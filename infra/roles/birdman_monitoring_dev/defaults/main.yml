---
# Дев-роль наблюдаемости birdman (итерация 4, docs/specs/ops.md §1, §5).
# Весь стек — docker compose, проект birdman-monitoring, ВСЁ строго на
# 127.0.0.1 (наружу — только SSH-туннель). Чужой prod-node_exporter на
# 127.0.0.1:4027 скрейпим read-only и НЕ управляем им.

# --- образы (пинуем версии) ---
birdman_vm_image: victoriametrics/victoria-metrics:v1.102.1
birdman_vmagent_image: victoriametrics/vmagent:v1.102.1
birdman_vmalert_image: victoriametrics/vmalert:v1.102.1
birdman_grafana_image: grafana/grafana:11.2.0
birdman_alertmanager_image: prom/alertmanager:v0.27.0
birdman_alert_sink_image: python:3.12-alpine
birdman_pg_image: postgres:16          # throwaway для restore-drill (совпадает с сервером)

# uid, под которым бежит контейнер alertmanager'а (tracker #1072). Переменная
# существует не для настройки, а чтобы число не стояло в таске голым: образ
# выше намеренно бежит НЕ от root (`prom/alertmanager:v0.27.0` → nobody,
# uid=65534 — `docker run --rm --entrypoint id <образ> -u`), а его конфиг
# кладётся 0600 (может содержать Discord-webhook). 0600 + владелец root =
# «permission denied» на старте, то есть доставка алертов не работает ВООБЩЕ и
# молча — ровно это и случилось: контейнер стоял в краш-лупе с рождения,
# RestartCount 2380 за ~40 часов, alerts.log заморожен, история панели пуста.
# Поэтому владелец файла = uid контейнера (root читает и так, DAC-bypass), а
# режим остаётся 0600.
#
# ПОДНЯЛ ВЕРСИЮ ОБРАЗА — ПЕРЕПРОВЕРЬ ЭТОТ uid. Забыть нечем: сьют роли
# (tests/mounted_config_access.py) сверяет владельца немирочитаемых маунтов с
# настоящим uid образа, а не с таблицей в тесте.
birdman_alertmanager_uid: "65534"

# --- каталоги ---
birdman_monitoring_dir: /opt/birdman/monitoring        # compose.yml
birdman_monitoring_conf_dir: /etc/birdman/monitoring   # шаблонные конфиги (ro-маунты)
birdman_log_dir: /var/log/birdman
birdman_alerts_log: /var/log/birdman/alerts.log        # сюда logger-sink пишет алерты

# --- ротация alerts.log (tracker #1073) ---
# Потолка у файла не было вовсе: 498 МБ за два часа, пока vmalert постил в sink
# напрямую каждые 5с. Ротация ПО РАЗМЕРУ, а не daily, потому что история панели
# ограничена текущим файлом (master читает один путь, master.md §6) — daily
# обнуляла бы её каждые сутки. При штатном темпе (alertmanager группирует,
# repeat_interval 1h) 32M не набираются практически никогда, так что порог
# работает страховкой от повтора того темпа, а не ежедневной стрижкой истории.
# Потолок на диске: живой файл в размер порога плюс столько сжатых архивов,
# сколько задано ниже (JSON жмётся в разы).
birdman_alerts_log_rotate_size: 32M
birdman_alerts_log_rotate_keep: 4

# --- bind (ТОЛЬКО localhost) ---
birdman_bind_addr: "127.0.0.1"
birdman_vm_port: 8428
birdman_vmagent_port: 8429
birdman_vmalert_port: 8880
birdman_grafana_port: 3000
birdman_alert_sink_port: 9094
birdman_alertmanager_port: 9093

# --- VictoriaMetrics / скрейп ---
# 5s: NodeDown порог 30s + scrape + eval квантование. С 10s worst-case ~60с
# (впритык к acceptance ≤60с); 5s даёт NodeDown в alerts.log ~40с с запасом.
# Нагрузка на дев-боксе копеечная (3 таргета, метрик десятки).
birdman_vm_retention: 30d
birdman_scrape_interval: 5s
birdman_eval_interval: 5s

# Цели скрейпа — список job'ов (расширяемо: добавить ноду = добавить target).
# vmagent идёт в host-network, поэтому это 127.0.0.1 самого бокса.
#
# ДЖОБЫ АГЕНТОВ СЮДА НЕ ПИШУТСЯ РУКАМИ (tracker #1065). На боксе может быть
# несколько нод birdman, у каждой свой порт /metrics, и роль выводит по джобу
# на ноду из ТОГО ЖЕ birdman_agent_instances, из которого агентская роль
# раскладывает сами ноды (tasks/monitoring.yml, «Derive a scrape job per
# birdman node of this box»). Один источник правды: забыть джоб для новой ноды
# нечем, а забытый джоб — это молчащие DiskHigh/TickDegraded, выглядящие как
# здоровье. Этот список — всё ОСТАЛЬНОЕ; свои джобы оператор добавляет сюда.
birdman_scrape_jobs:
  # Master отдаёт реестр на СВОЁМ листенере, не на порту API (tracker #1003,
  # birdman_master_metrics_addr роли birdman_master_dev).
  - job_name: birdman-master
    metrics_path: /metrics
    targets: ["127.0.0.1:9102"]
  - job_name: node
    metrics_path: /metrics
    targets: ["127.0.0.1:4027"]        # ЧУЖОЙ prod node_exporter — read-only

# --- ноды birdman этого бокса (зеркало контракта роли birdman_agent_dev) ---
# Список тот же, что читает агентская роль; здесь нужны только имя, порт
# метрик и регион. Дефолты обязаны совпадать с её дефолтами — иначе джоб
# укажет не на тот порт, а это ровно тот класс расхождения «код уехал, роль
# осталась», ради которого заведены ScrapeTargetDown/Missing (#1061).
birdman_agent_instances:
  - {}
birdman_agent_metrics_port: 9101
# node/region — единообразие с нодовыми vmagent'ами (5.2): правила и дашборды
# различают ноды по одному лейблу. Легаси-нода бокса сохраняет исторический
# лейбл node=<имя в инвентаре>, чтобы не рвать непрерывность рядов.
birdman_region: dev

# vmagent host-network → пишет в опубликованный на хосте порт VM.
birdman_vm_remote_write_url: "http://127.0.0.1:8428/api/v1/write"

# --- VictoriaLogs (логи дедиков; спека 2026-07-09-centralized-logs-design.md) ---
birdman_vl_image: victoriametrics/victoria-logs:v1.51.0
birdman_vl_port: 9428
birdman_vl_retention: 14d        # решение владельца 09.07.2026

# --- Grafana ---
# Пароль admin ГЕНЕРИТСЯ ansible'ом в 0600-файл на тачке (не хардкодим, не
# коммитим). Отсюда же он попадает в 0600 grafana.env (env_file для контейнера).
birdman_grafana_admin_password_file: /etc/birdman/grafana_admin_password
birdman_grafana_datasource_url: "http://victoriametrics:8428"   # bridge-DNS внутри compose

# --- маршрутизация алертов ---
# Alertmanager — безусловное звено доставки (ops.md §1, tracker #238):
# vmalert → alertmanager → alert-sink ВСЕГДА (пишет /var/log/birdman/alerts.log
# — история панели); непустой webhook ДОБАВЛЯЕТ discord_configs в тот же
# receiver, sink из цепочки не выпадает.
birdman_alert_discord_webhook: ""

# --- пороги алертов (vmalert, ops.md §1) ---
# ScrapeTargetDown (tracker #1061): сколько таргет обязан лежать, прежде чем
# будить. 3м — с запасом к ХУДШЕМУ штатному выкату: pull-деплоер ждёт /healthz
# birdman_devdeploy_health_timeout_s (60s) и при провале откатывается на прежний
# бинарь с ещё одним таким же ожиданием, т.е. ~2м недоступности; обычный выкат —
# секунды. Опускать ниже 2м = будить на каждом откате.
birdman_scrape_down_for: "3m"
# ScrapeTargetMissing (tracker #1061): окно, за которое отсутствие ЛЮБОГО сэмпла
# `up` джоба считается пропажей таргета (а не сбоем скрейпа — тот даёт up=0).
# Это окно И ЕСТЬ порог правила: у него for: 0s, иначе задержка складывалась бы
# дважды. 10м > 3м у ScrapeTargetDown намеренно: пропажа серии — это либо
# конфигурационный дрейф, либо смерть самого vmagent'а, и торопиться с ней
# некуда, а вот ложно сработать на перезапуске стека мониторинга — легко.
birdman_scrape_missing_window: "10m"
# Гейт свежести скрейпа на increase-правилах (tracker #1063): надбавка к окну
# правила, из которой складывается окно гейта (5m → 5m15s). Закрывает щель
# ровно в ОДИН СКРЕЙП: последний сэмпл up=0 пишется на скрейп РАНЬШЕ, чем
# приезжает первый сэмпл вернувшегося счётчика, поэтому гейт с окном ровно в
# окно правила открывался бы на один скрейп раньше, чем кончается загрязнение
# (замерено живьём — вспышка ложных CrashLoop/AllocationFailures на границе).
# ДОЛЖНА быть >= birdman_scrape_interval, иначе щель возвращается; и обязана
# быть выражена в СЕКУНДАХ — окно гейта склеивается конкатенацией ("5m" +
# "15s" = 5m15s), а "5m" + "1m" дало бы невалидный PromQL. Больше нужного не
# ставить: надбавка сверх одного скрейпа начинает съедать настоящий рост,
# случившийся сразу после возврата.
birdman_scrape_gate_margin: "15s"
birdman_heartbeat_max_age_seconds: 30
birdman_tick_degraded_ms: 50           # порог игры для TickDegraded
birdman_disk_warn_pct: 85
birdman_disk_crit_pct: 92
birdman_ready_empty_for: "3m"          # BufferEmpty: ready==0 держится столько
birdman_tick_degraded_for: "5m"
# AgentlinkPendingStuck: непустая очередь unacked-команд master→agent держится
# дольше этого порога (Ack/реплей опустошают её за секунды; при дренаже серия
# исчезает по staleness и pending-состояние алерта сбрасывается само).
birdman_pending_stuck_for: "10m"
# CertExpiry (mTLS agentlink v1): предупреждаем, когда любой серт (CA/сервер
# master'а, клиентский серт ноды, локальный взгляд агента) истекает раньше чем
# через это окно. 14д = renewal-окно клиентских сертов (дизайн §1). Само окно
# совпадает с порогом renewal, а тикер renewal — 24ч, поэтому "горит, только
# если renewal застрял" обеспечивает НЕ этот порог, а for:25h у правила
# (rules.yml.j2): здоровый серт законно бывает <14д до ~24ч за цикл.
# 14*86400 = 1209600.
birdman_cert_expiry_warn_seconds: 1209600

# --- бэкапы Postgres (ops.md §5; Backups v1 — дампит сам master) ---
# Расписание/ретеншны/S3 настраиваются в панели; здесь остались каталог,
# параметры restore-drill'а и порог алерта.
birdman_pg_db: birdman
birdman_pg_user: postgres
birdman_backups_dir: /var/lib/birdman/backups
birdman_backup_stale_for: 15m          # BackupStale: for-порог vmalert

# --- pull-деплоер дев-стенда (spec 2026-08-10) ---
birdman_devdeploy_failed_for: 5m       # DevDeployFailed: for-порог vmalert
birdman_devdeploy_stale_after_h: 6     # DevDeployStale: часов без успешного тика
