---
# -l-guard: до рендера хаб-конфига падаем, если этот прогон молча выбил бы
# из wg.conf живой peer (нода без pubkey-факта, чей /32 уже в конфиге).
# Логика вынесена в guard.yml — исполняется рендер-обвязкой напрямую.
- name: Guard against silently dropping live hub peers (-l-guard, только хаб)
  ansible.builtin.include_tasks: guard.yml
  when: birdman_overlay_mode == 'hub'

- name: Render WireGuard config (peers/port; без секретов, но 0600 — defensive)
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "{{ birdman_overlay_conf_dir }}/wg.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart birdman-overlay

- name: Allow overlay UDP port in UFW (только хаб, аддитивно)
  community.general.ufw:
    rule: allow
    port: "{{ birdman_overlay_port }}"
    proto: udp
    comment: "{{ birdman_ufw_comment }}"
  when: birdman_overlay_mode == 'hub'

- name: Allow decapsulated control-plane ports on overlay iface (только хаб)
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ birdman_overlay_iface }}"
    port: "{{ item }}"
    proto: tcp
    comment: "{{ birdman_ufw_comment }}"
  loop: "{{ birdman_overlay_forwards }}"
  when: birdman_overlay_mode == 'hub'

- name: Render overlay compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ birdman_overlay_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-overlay

# ПРОВЕРЕНО (tracker #265, уточнено #962; ansible-core 2.16 и 2.21): гард
# `... is not skipped` перед деref'ом регистра здесь НЕ нужен.
# command/shell check-режим ПОДДЕРЖИВАЮТ (supports_check_mode=True) и скипаются
# САМИ, уже внутри модуля, возвращая полноформатный результат (rc=0, stdout='',
# stderr='', skipped=true) — .stderr/.rc под --check есть. Сверх того,
# changed_when у скипнутого таска движок не вычисляет вовсе (task_executor:
# `if not utr.skipped`). Оба регистра (compose_up, ping) больше нигде в репо не
# разыменовываются.
# Про «класс 236/248/257» в соседних комментариях — точная разбивка (#962):
#   236 — да, тот класс: uri check-режим НЕ поддерживает, движок скипает таск,
#         у регистра остаётся голый {skipped, msg}, любой деref падает;
#   248 — shell, у регистра .stdout='' есть; гард там всё равно чинил РЕАЛЬНЫЙ
#         дефект (пустой stdout ложно валил fail-гейт «ключ не найден»),
#         но не тот, что описан в его комментарии;
#   257 — command, .stdout='' есть; деref не падал, гард был не нужен и сам
#         сломал check-режим (undefined pubkey-факт) — это и есть #962.
- name: Start birdman-overlay (docker compose, идемпотентно)
  ansible.builtin.command:
    cmd: docker compose -f {{ birdman_overlay_dir }}/compose.yml up -d --wait
  register: birdman_overlay_compose_up
  changed_when: "'Started' in birdman_overlay_compose_up.stderr or 'Created' in birdman_overlay_compose_up.stderr or 'Recreated' in birdman_overlay_compose_up.stderr"

- name: Apply pending overlay restart (образ/конфиг поменялись)
  ansible.builtin.meta: flush_handlers

- name: Wait for hub forwarders on overlay IP (только хаб)
  ansible.builtin.wait_for:
    host: "{{ birdman_overlay_ip }}"
    port: "{{ item }}"
    timeout: 30
  loop: "{{ birdman_overlay_forwards }}"
  when: birdman_overlay_mode == 'hub'

# until, в отличие от changed_when, у скипнутого таска ВЫЧИСЛЯЕТСЯ (ветка
# retries в task_executor про skipped не знает) — но .rc в check-результате
# command есть и равен 0, поэтому условие истинно с первой попытки: ни стопа,
# ни ретрай-шторма на delay*retries. Подробности — в блоке выше (#265).
- name: Assert hub reachable through tunnel (только спок)
  ansible.builtin.command:
    cmd: ping -c 1 -W 3 {{ hostvars[birdman_overlay_hub_host].birdman_overlay_ip }}
  changed_when: false
  when: birdman_overlay_mode == 'spoke'
  register: birdman_overlay_ping
  retries: 5
  delay: 2
  until: birdman_overlay_ping.rc == 0
