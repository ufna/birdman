---
- name: Assert docker is present (контейнерный оверлей без docker невозможен)
  ansible.builtin.command:
    cmd: docker info
  changed_when: false

- name: Create overlay directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ birdman_overlay_dir }}", mode: "0755" }
    - { path: "{{ birdman_overlay_dir }}/build", mode: "0755" }
    - { path: "{{ birdman_overlay_conf_dir }}", mode: "0700" }

- name: Copy image build context (Dockerfile + entrypoint)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ birdman_overlay_dir }}/build/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [Dockerfile, entrypoint.sh]
  register: birdman_overlay_build_ctx

- name: Check overlay image exists
  ansible.builtin.command:
    cmd: docker image inspect {{ birdman_overlay_image }}
  register: birdman_overlay_image_check
  changed_when: false
  failed_when: false

# ВНИМАНИЕ (уточнено в #962 прямой пробой на core 2.21.1): конъюнкт
# `is not skipped` здесь НЕ обязателен — вопреки исходному комментарию #257,
# .rc под --check СУЩЕСТВУЕТ. command/shell check-режим поддерживают
# (supports_check_mode=True) и скипаются САМИ, внутри модуля, возвращая
# полноформатный результат rc=0, stdout='', stderr='', skipped=true
# (ansible/modules/command.py). Класс «регистр = голый {skipped, msg}» — про
# модули БЕЗ поддержки check-режима (uri в #236), не про этот таск.
# Гард оставлен как есть (он безвреден и тождественен): под --check rc=0, так
# что и без него условие сводится к «context is changed»; в бою probe
# исполняется всегда (у него нет when) → `is not skipped` тождественно истинно.
# Сам build под --check скипается движком в любом случае.
- name: Build overlay image (локально на боксе, без внешнего registry)
  ansible.builtin.command:
    cmd: docker build -t {{ birdman_overlay_image }} {{ birdman_overlay_dir }}/build
  when: >-
    birdman_overlay_build_ctx is changed
    or (birdman_overlay_image_check is not skipped
        and birdman_overlay_image_check.rc != 0)
  notify: Restart birdman-overlay

# Приватный ключ рождается и умирает на своём боксе: no_log, 0600, creates.
# У образа есть ENTRYPOINT — для утилитных вызовов всегда --entrypoint.
- name: Generate WireGuard private key (once, box-only)
  ansible.builtin.shell:
    cmd: umask 077 && rm -f {{ birdman_overlay_conf_dir }}/wg.key.tmp && docker run --rm --entrypoint wg {{ birdman_overlay_image }} genkey > {{ birdman_overlay_conf_dir }}/wg.key.tmp && mv {{ birdman_overlay_conf_dir }}/wg.key.tmp {{ birdman_overlay_conf_dir }}/wg.key
    creates: "{{ birdman_overlay_conf_dir }}/wg.key"
  no_log: true

# read-before-create (класс #258, которым overlay-роль не была покрыта): file
# state=file (дефолт) энфорсит владельца/режим ключа, который создаёт shell
# строкой выше. В --check на свежем боксе ключ не материализуется → модуль
# честно падает «file (...) is absent, cannot continue», и до up.yml прогон
# вообще не доходит. stat-проба + гард `not ansible_check_mode or exists`
# пускают --check насквозь; в бою `not ansible_check_mode` тождественно истинно
# (ключ создан выше либо уже был по creates:) → семантика неизменна.
- name: Probe overlay private key (check-mode fresh-box guard)
  ansible.builtin.stat:
    path: "{{ birdman_overlay_conf_dir }}/wg.key"
    get_checksum: false   # файл — приватный ключ: хеш в выводе -v ни к чему
  register: birdman_overlay_key_stat

- name: Enforce key ownership and mode
  ansible.builtin.file:
    path: "{{ birdman_overlay_conf_dir }}/wg.key"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or birdman_overlay_key_stat.stat.exists

- name: Derive public key
  ansible.builtin.command:
    cmd: docker run --rm -v {{ birdman_overlay_conf_dir }}:/keys:ro --entrypoint sh {{ birdman_overlay_image }} -c 'wg pubkey < /keys/wg.key'
  register: birdman_overlay_pubkey_cmd
  changed_when: false

# Как у Build выше, комментарий #257 был неточен: .stdout под --check есть и
# равен '' (command скипается сам, внутри модуля). Гард `is not skipped`
# оставлен (в бою он тождественно истинен — у command нет when), но САМ ПО СЕБЕ
# он ломал check-режим: факт не публиковался НИ У КОГО, и дальше по прогону
# undefined-факт валил два сайта (tracker #962) — спок-ветку wg.conf.j2
# («no attribute 'birdman_overlay_pubkey'») и -l-guard хаба, который считал
# dropped'ом ноду без факта и давал ложную тревогу на полном прогоне.
# Поэтому в check-режиме факт публикуется ЯВНОЙ заглушкой (парный set_fact
# ниже): downstream видит defined-значение, ничего на диск не пишется, а
# -l-guard остаётся живым — ноды ВНЕ прогона факта по-прежнему не получают,
# значит настоящий вывод живого peer'а он ловит и под --check.
- name: Publish pubkey as host fact (публичен; конфиги соседей читают его из hostvars)
  ansible.builtin.set_fact:
    birdman_overlay_pubkey: "{{ birdman_overlay_pubkey_cmd.stdout | trim }}"
  when: birdman_overlay_pubkey_cmd is not skipped

# Заведомо невалидный base64-ключ: если такая строка когда-нибудь доедет до
# боевого wg.conf, `wg setconf` откажется её съесть (громкий отказ вместо
# тихо битого туннеля). В --check на диск ничего не пишется.
- name: Publish placeholder pubkey in check mode (факт обязан быть defined)
  ansible.builtin.set_fact:
    birdman_overlay_pubkey: CHECK-MODE-PLACEHOLDER-NOT-A-REAL-PUBKEY
  when: birdman_overlay_pubkey_cmd is skipped

- name: Note that pubkey is a placeholder in check mode
  ansible.builtin.debug:
    msg: >-
      check mode: вывод pubkey не исполнялся (command скипает себя под --check)
      — в превью wg.conf вместо ключа стоит
      CHECK-MODE-PLACEHOLDER-NOT-A-REAL-PUBKEY. Боевой прогон выводит настоящий
      ключ из wg.key и рендерит конфиг как обычно.
  when: birdman_overlay_pubkey_cmd is skipped
