---
# Pull-деплоер дев-стенда (спека 2026-08-10 §4–§5). Ставится только на
# master-бокс: он и держит admin-ключ, и слушает master API на localhost.
#
# Это дев-обвязка, НЕ часть self-host по умолчанию: у self-host-оператора свой
# релизный цикл, и авто-выкат чужой ветки разработки ему не нужен.
birdman_devdeploy_enabled: true

# Дев-сборки лежат OCI-артефактом в GHCR-пакете, а не релизами GitHub: релиз —
# обещание пользователям, а здесь чистый дев-стейт (решение владельца
# 11.08.2026). Пакет ПУБЛИЧНЫЙ — бокс тянет его анонимным pull-токеном, и
# никаких учётных данных реестра на боксе не заводится.
birdman_devdeploy_registry: ghcr.io
birdman_devdeploy_package: ufna/birdman-dev
# Подвижный тег канала (не ветка): его переставляет dev-build.yml на каждую
# сборку из main.
birdman_devdeploy_tag: dev
# Тик таймера. 60с — компромисс между «увидел билд сразу» и шумом в журнале.
birdman_devdeploy_interval_s: 60
# Сколько ждать 200 от /healthz после рестарта мастера, прежде чем откатывать.
birdman_devdeploy_health_timeout_s: 60
# Сколько ждать, пока нода перепредставится с целевой версией агента. С запасом
# к 70-секундному watchdog'у мастера, чтобы два механизма не спорили.
birdman_devdeploy_agent_timeout_s: 90
birdman_devdeploy_poll_interval_s: 2

birdman_devdeploy_bin: /usr/local/bin/birdman-master
birdman_devdeploy_service: birdman-master
birdman_devdeploy_state_dir: /var/lib/birdman-master
birdman_devdeploy_master_api: "http://127.0.0.1:8100"
birdman_devdeploy_admin_key_file: /etc/birdman/master-admin.key
# Каталог textfile-коллектора node_exporter бокса. ⚠️ Сам node_exporter —
# ЧУЖОЙ (роль мониторинга скрейпит его read-only и не управляет им), а каталог
# — стандартный drop-in, в котором уже лежат .prom-файлы других проектов
# владельца. Мы кладём туда РОВНО ОДИН свой файл birdman-devdeploy.prom и
# больше ничего не трогаем; снос роли = удаление этого файла.
# Пустая строка → метрики не пишутся (скрипт это переживает), остаётся журнал.
birdman_devdeploy_textfile_dir: /var/lib/node_exporter/textfile_collector
