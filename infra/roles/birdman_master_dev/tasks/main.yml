---
# Всё аддитивно и только birdman-объекты (общий дев-бокс): свой compose-проект
# birdman (контейнер birdman-postgres), свой unit, свои файлы в /etc/birdman.

- name: Create birdman master directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/birdman
    - "{{ birdman_master_dir }}"
    - "{{ birdman_master_data_dir }}"

# Backups v1 (spec 2026-07-13): master исполняет pg_dump сам — клиент нужен на
# хосте. Ubuntu 24.04: postgresql-client-16 в штатных репах (16.14, проверено
# 13.07.2026), pgdg не нужен. Первый apt-таск в ролях — осознанное решение
# владельца, единственное касание хоста.
- name: Install postgresql-client-16 (master runs pg_dump — Backups v1)
  ansible.builtin.apt:
    name: postgresql-client-16
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Generate Postgres password once (kept only on the box)
  ansible.builtin.copy:
    content: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    dest: "{{ birdman_master_pg_pass_file }}"
    force: false          # только если файла ещё нет — идемпотентно
    owner: root
    group: root
    mode: "0600"
  no_log: true

# read-before-create: slurp/set_fact/шаблоны ниже читают пароль из файла,
# который создаёт copy выше (force:false). В --check на свежем боксе copy файл
# НЕ материализует → slurp честно падает («file not found»), каскадом валя
# set_fact и оба шаблона. stat-проба + гард `not ansible_check_mode or exists`
# пускают --check насквозь: в бою not ansible_check_mode тождественно истинно
# (файл к тому же только что создан строкой выше) → семантика неизменна; только
# --check на свежем боксе (файла реально нет) мягко скипает чтение и рендер.
- name: Probe Postgres password file (check-mode fresh-box guard)
  ansible.builtin.stat:
    path: "{{ birdman_master_pg_pass_file }}"
  register: birdman_pg_pass_stat

- name: Read Postgres password
  ansible.builtin.slurp:
    src: "{{ birdman_master_pg_pass_file }}"
  register: birdman_pg_pass_raw
  no_log: true
  when: not ansible_check_mode or birdman_pg_pass_stat.stat.exists

- name: Set Postgres password fact
  ansible.builtin.set_fact:
    birdman_pg_password: "{{ birdman_pg_pass_raw.content | b64decode | trim }}"
  no_log: true
  when: not ansible_check_mode or birdman_pg_pass_stat.stat.exists

- name: Note that Postgres provisioning is bypassed on a fresh box in check mode
  ansible.builtin.debug:
    msg: >-
      check mode: файла пароля Postgres ещё нет (свежий бокс) — чтение пароля и
      рендер compose.yml/master.yaml пропущены (пароль не материализован под
      --check). Боевой прогон создаёт пароль и рендерит конфиги как обычно.
  when:
    - ansible_check_mode
    - not birdman_pg_pass_stat.stat.exists

- name: Install docker compose file (postgres only, bound to 127.0.0.1)
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ birdman_master_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"          # содержит пароль postgres
  no_log: true
  when: not ansible_check_mode or birdman_pg_pass_stat.stat.exists

- name: Start birdman postgres (docker compose, idempotent)
  ansible.builtin.command:
    cmd: docker compose -f {{ birdman_master_dir }}/compose.yml up -d --wait
  register: birdman_compose_up
  changed_when: "'Started' in birdman_compose_up.stderr or 'Created' in birdman_compose_up.stderr"

- name: Install birdman-master binary
  ansible.builtin.copy:
    src: "{{ birdman_master_binary }}"
    dest: /usr/local/bin/birdman-master
    owner: root
    group: root
    mode: "0755"
  notify: Restart birdman-master

# Мастер-ключ шифрования обратимых секретов at-rest (registries.token,
# internal_ca.key_pem — дизайн secrets-encryption §2/§6). openssl rand, а НЕ
# lookup('password'): нужен полноэнтропийный 256-битный ключ, не пароль из
# букв-цифр. Идемпотентно (creates:) — генерится один раз; никогда не
# регенерируется (регенерация замаскировала бы DR-сбой «не тот ключ»).
# Запись атомарна (mktemp в том же каталоге → openssl → mv): если openssl
# упадёт на полпути, финальный путь не появится и creates: не заблокирует
# повторную генерацию — пустой/битый ключ никогда не «залипает».
- name: Generate master secrets key once (kept only on the box)
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    tmp="$(mktemp {{ birdman_master_secrets_key_file }}.XXXXXX)"
    trap 'rm -f "$tmp"' EXIT
    openssl rand -base64 32 > "$tmp"
    mv "$tmp" {{ birdman_master_secrets_key_file }}
  args:
    creates: "{{ birdman_master_secrets_key_file }}"
    executable: /bin/bash
  register: birdman_secrets_key_gen
  no_log: true

# read-before-create: file state=file (дефолт) ниже энфорсит владельца/режим
# ключа, который создаёт shell выше. shell не поддерживает check-режим (движок
# скипает) → в --check на свежем боксе ключа нет → file state=file падает
# «file ... is absent, cannot continue». stat-проба + гард пускают --check
# насквозь; в бою not ansible_check_mode тождественно истинно (ключ создан выше
# или уже был по creates:) → семантика неизменна.
- name: Probe master secrets key (check-mode fresh-box guard)
  ansible.builtin.stat:
    path: "{{ birdman_master_secrets_key_file }}"
  register: birdman_secrets_key_stat

- name: Enforce secrets key ownership/mode
  ansible.builtin.file:
    path: "{{ birdman_master_secrets_key_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or birdman_secrets_key_stat.stat.exists

# Только при первом провижининге: ключ обязателен для DR, но кладётся ТОЛЬКО в
# менеджер паролей владельца — не в git/vault (инвариант «секреты только на
# боксе», решение владельца: эскроу = менеджер паролей).
- name: Remind operator to escrow the secrets key (first provisioning only)
  ansible.builtin.debug:
    msg: >-
      Эскроу {{ birdman_master_secrets_key_file }} в менеджер паролей владельца —
      без него restore дампа нечитаем (master упадёт с key_id-mismatch). Ключ
      НЕ класть в git/vault и НЕ рядом с дампами/в бэкап-хранилище.
  when: birdman_secrets_key_gen is changed

- name: Install master config /etc/birdman/master.yaml
  ansible.builtin.template:
    src: master.yaml.j2
    dest: /etc/birdman/master.yaml
    owner: root
    group: root
    mode: "0600"          # содержит DSN с паролем
  no_log: true
  notify: Restart birdman-master
  when: not ansible_check_mode or birdman_pg_pass_stat.stat.exists   # DSN содержит pg-пароль (тот же каскад)

- name: Install birdman-master.service unit
  ansible.builtin.copy:
    src: birdman-master.service
    dest: /etc/systemd/system/birdman-master.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart birdman-master

# read-before-create: enable/start (и handler Restart birdman-master ниже)
# действуют на unit, который ставит copy выше. copy в --check unit НЕ пишет →
# на свежем боксе systemd падает «Could not find the requested service». stat
# юнита + гард пускают --check насквозь; в бою not ansible_check_mode
# тождественно истинно (unit всегда на месте — copy строкой выше) → семантика
# неизменна. Тот же birdman_master_unit_stat гардит и handler (см. handlers).
- name: Probe birdman-master unit (check-mode fresh-box guard)
  ansible.builtin.stat:
    path: /etc/systemd/system/birdman-master.service
  register: birdman_master_unit_stat

- name: Enable and start birdman-master
  ansible.builtin.systemd_service:
    name: birdman-master.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or birdman_master_unit_stat.stat.exists

- name: Apply pending master restarts before health check
  ansible.builtin.meta: flush_handlers

- name: Wait for master REST API (healthz)
  ansible.builtin.uri:
    url: "http://{{ birdman_master_api_addr }}/healthz"
    status_code: 200
  register: birdman_master_health
  retries: 30
  delay: 2
  until: birdman_master_health.status == 200

# Bootstrap admin-ключ печатается master'ом ОДИН раз при первом старте с
# пустой таблицей api_keys — выхватываем его из журнала и сохраняем 0600.
- name: Check for stored admin API key
  ansible.builtin.stat:
    path: "{{ birdman_master_admin_key_file }}"
  register: birdman_admin_key_stat

# harvest — best-effort: сам он НИКОГДА не решает «есть ключ / нет», решает
# единый гейт ниже по birdman_admin_key_raw.stdout (его fail.msg НЕ под no_log
# → оператор видит подсказку). Поэтому failed_when: false. Под `set -o pipefail`
# шаг иначе падает САМ раньше гейта: (а) журнал ротирован → grep без совпадений
# rc=1; (б) даже успешный мульти-матч → rc=141 (SIGPIPE: `head -1` закрывает
# пайп раньше grep). А no_log спрятал бы вывод такого падения. failed_when: false
# гасит оба режима (и любой rc journalctl); pipefail оставлен как есть.
- name: Harvest bootstrap admin key from master journal
  ansible.builtin.shell: >
    set -o pipefail;
    journalctl -u birdman-master --no-pager -o cat
    | grep -oE '"api_key":"bmk_[^"]+"' | head -1 | cut -d'"' -f4
  args:
    executable: /bin/bash
  register: birdman_admin_key_raw
  changed_when: false
  failed_when: false
  no_log: true
  when: not birdman_admin_key_stat.stat.exists

# shell не поддерживает check-режим (движок его скипает) → в --check на свежем
# боксе (ключа на диске нет) у birdman_admin_key_raw нет .stdout. В бою при
# отсутствии ключа harvest выполняется всегда (его when — ровно
# `not ...exists`) → `is not skipped` тождественно истинен, гард ничего не
# меняет.
- name: Fail if bootstrap admin key is not recoverable
  ansible.builtin.fail:
    msg: >-
      Bootstrap admin-ключ не найден ни в {{ birdman_master_admin_key_file }},
      ни в журнале birdman-master. Ключ печатается один раз при первом старте
      с пустой api_keys; если журнал ротирован — сбросьте таблицу api_keys
      (docker exec birdman-postgres psql -U postgres birdman -c "delete from api_keys")
      и перезапустите master.
  when:
    - not birdman_admin_key_stat.stat.exists
    - birdman_admin_key_raw is not skipped
    - birdman_admin_key_raw.stdout | trim | length == 0

- name: Note that admin key harvest is bypassed in check mode
  ansible.builtin.debug:
    msg: >-
      check mode: harvest admin-ключа пропущен движком (shell без
      check-режима) — наличие ключа в журнале не сверяется. Боевой прогон
      соберёт ключ из журнала или упадёт с подсказкой, если журнал ротирован.
  when:
    - not birdman_admin_key_stat.stat.exists
    - birdman_admin_key_raw is skipped

# Как у fail-гейта: в --check harvest скипнут → нет .stdout для content.
- name: Store admin API key (0600, box only)
  ansible.builtin.copy:
    content: "{{ birdman_admin_key_raw.stdout | trim }}"
    dest: "{{ birdman_master_admin_key_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - not birdman_admin_key_stat.stat.exists
    - birdman_admin_key_raw is not skipped

# Публичный вхост панели — последним шагом: мастер к этому моменту уже отвечает
# на healthz, так что проксировать есть что. Пустой домен (дефолт) = nginx не
# трогаем вовсе.
- name: Publish the panel over a domain (optional)
  ansible.builtin.include_tasks: nginx.yml
  when: birdman_panel_domain | length > 0
