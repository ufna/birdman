---
# Дев-роль birdman-master на общем боксе (итерация 1).
# Путь деплоя: СТАТИЧЕСКИЙ БИНАРЬ + systemd (проще, чем собирать образ на
# тачке: не нужен исходник репо на боксе, рестарт/логи — штатный systemd);
# Postgres 16 — docker compose (адаптация master/dev-compose.yml),
# порт ТОЛЬКО 127.0.0.1:5433 (5432 может быть занят чужим продом).
# Master слушает только localhost: 8100 (REST) и 8444 (gRPC) — наружу ничего.
birdman_master_binary: "{{ playbook_dir }}/../../master/dist/birdman-master"

birdman_master_dir: /opt/birdman
birdman_master_data_dir: /var/lib/birdman-master   # self-signed TLS-пара master
birdman_master_api_addr: "127.0.0.1:8100"
birdman_master_grpc_addr: "127.0.0.1:8444"
# Прометеевская экспозиция master'а — СВОЙ листенер (tracker #1003): на
# listen_api ручки /metrics больше нет вовсе. 9101 занят агентом этого же бокса.
birdman_master_metrics_addr: "127.0.0.1:9102"
birdman_master_pg_port: 5433

# Секреты живут ТОЛЬКО на тачке (0600): пароль Postgres генерируется при
# первом прогоне, admin-ключ выхватывается из журнала первого старта master,
# secrets.key (мастер-ключ шифрования обратимых секретов at-rest —
# registries.token/internal_ca.key_pem; дизайн secrets-encryption §2/§6)
# генерируется openssl'ом при первом прогоне; эскроу — менеджер паролей
# владельца, НИКОГДА в git/vault.
birdman_master_pg_pass_file: /etc/birdman/pg.pass
birdman_master_admin_key_file: /etc/birdman/master-admin.key
birdman_master_secrets_key_file: /etc/birdman/secrets.key

# Порог down для замолчавшей quarantine-ноды, минуты (>= 1). Равен встроенному
# дефолту master (config.go) — строка рендерится явно, чтобы крутить на боксе
# без пересборки (tracker #234); поведение при дефолте не меняется.
birdman_node_down_after_min: 10

# Режим аутентификации agentlink-листенера (mTLS agentlink v1, дизайн §3/§6):
# token|mixed|mtls. Дефолт mixed — переходный период: листенер принимает и
# cert-auth, и token-auth, Enroll включён. Флип в mtls (строгий mTLS) — по
# команде владельца в Фазе D; token — экстренный откат. CA master создаёт сам
# в Postgres при первом старте — здесь ничего доставлять не нужно.
# mtls: дев-бокс переведён в строгий режим (Фаза D 10.07.2026) — token-only Hello
# отвергается. Fresh-провижининг тоже ок: агент делает Enroll-by-token (он разрешён
# и в mtls) → серт → mTLS-сессия. Для zero-downtime перевода СУЩЕСТВУЮЩЕГО insecure-агента
# на мульти-нодовом флоте временно переопредели в `mixed` (-e), дождись sessions{token}=0, верни mtls.
# ⚠️ ИНВАРИАНТ (итерация 5, оверлей): пока на хабе живёт socat-форвардер
# (контейнер birdman-overlay), режим — ТОЛЬКО mtls. Форвардер отдаёт master'у
# peer-адрес 127.0.0.1, и в mixed токен-агент С ОВЕРЛЕЯ прошёл бы
# loopback-ветку гейта SetRegistries (спека iter5 §Безопасность). mixed на
# этом флоте больше не нужен: все ноды заходят mTLS через Enroll с первого
# коннекта.
birdman_agentlink_auth: mtls

# ── Публичный вхост панели/REST (спека panel-public-domain) ────────────────
# Пусто (дефолт) = роль НЕ КАСАЕТСЯ nginx вовсе: мастер как и раньше слушает
# только 127.0.0.1, наружу его пускает SSH-туннель. Задай домен — роль положит
# отдельный вхост в sites-available/-enabled системного nginx (чужие файлы не
# правятся ни строкой) и проксирует его на birdman_master_api_addr.
# Предпосылки на боксе: уже установленный nginx с раскладкой sites-available и
# уже выпущенный сертификат — роль не ставит первое и не выпускает второе.
birdman_panel_domain: ""
# Каталог с fullchain.pem/privkey.pem. Дефолт — каталог самого хоста (обычный
# certbot certonly -d <домен>); под WILDCARD-сертом это каталог базового имени
# (напр. /etc/letsencrypt/live/dev.example.com для панели panel.dev.example.com).
birdman_panel_tls_dir: "/etc/letsencrypt/live/{{ birdman_panel_domain }}"
# Имя файла вхоста в sites-available/sites-enabled (и префикс его логов).
birdman_panel_nginx_site: birdman-panel
