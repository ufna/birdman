---
# Дев-нода birdman (итерации 0–1): master (postgres в compose + статический
# бинарь под systemd, только localhost) + агент (демон под master'ом,
# регистрация ноды, UFW-порты дедиков). Требует env BIRDMAN_GHCR_TOKEN и
# собранные бинари agent/dist + master/dist (см. infra/README.md).
# containerd НЕ ставим: на дев-боксе он уже есть (docker); прод-роль — specs/ops.md §4.
# Порядок ролей важен: агент регистрируется в живом master.
- name: birdman dev node — master + agent (iteration 1)
  hosts: birdman_dev
  become: true
  roles:
    - birdman_master_dev
    - birdman_agent_dev
    # Последней: сверяет, что все birdman-контейнеры на боксе переживут ребут.
    - birdman_restart_guard
