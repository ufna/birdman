---
# Стек наблюдаемости + ops birdman (итерация 4, docs/specs/ops.md §1, §5):
# VictoriaMetrics + vmagent + vmalert + Grafana + alertmanager + alert-sink
# (docker compose, всё на 127.0.0.1) и systemd-бэкапы Postgres. Запускать ПОСЛЕ
# dev-node.yml (нужны живой birdman-postgres для бэкапов и цели скрейпа
# agent/master). Всё аддитивно; на общий дев-бокс кладёт только birdman-объекты.
#
#   ansible-playbook playbooks/monitoring.yml
#
# Доставка алертов (tracker #238): vmalert → alertmanager → alert-sink ВСЕГДА
# (пишет /var/log/birdman/alerts.log); непустой -e birdman_alert_discord_webhook=...
# добавляет Discord в тот же receiver.
- name: birdman dev node — monitoring + ops (iteration 4)
  hosts: birdman_dev
  become: true
  roles:
    - birdman_monitoring_dev
    # Последней: сверяет, что все birdman-контейнеры на боксе переживут ребут.
    - birdman_restart_guard
