[defaults]
# Запускать из каталога infra/: ansible-playbook playbooks/dev-node.yml
# Рабочий инвентарь — git-ignored hosts.local.yml (реальные IP/юзеры/ключи вне
# git; конвенция selfhost-v1). Шаблон для нового оператора — hosts.example.yml.
inventory = inventories/dev/hosts.local.yml
roles_path = roles
interpreter_python = auto_silent
# Артефакты ansible не должны попадать в репо
retry_files_enabled = False
