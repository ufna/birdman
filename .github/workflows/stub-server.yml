name: stub-server

on:
  push:
    branches: [main]
    paths:
      - 'examples/stub-server/**'
      - '.github/workflows/stub-server.yml'
  pull_request:
    paths:
      - 'examples/stub-server/**'
  # Ручной выпуск версии (итерация 3, CI-механика версий): собрать и запушить
  # образ с явным semver-тегом — им кормится POST /v1/versions / /v1/deploy.
  # Автодеплой-хук из workflow в master — TODO прод-фазы (docs/specs/ops.md §2:
  # master не в интернете).
  workflow_dispatch:
    inputs:
      tag:
        description: 'semver-тег образа (например 0.1.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Test
        working-directory: examples/stub-server
        run: |
          go vet ./...
          go test -race ./...

      - name: Validate tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ inputs.tag }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' \
            || { echo "tag '${{ inputs.tag }}' is not semver"; exit 1; }

      # Пуш в GHCR — встроенным GITHUB_TOKEN (packages: write).
      # PAT в workflow не используется нигде.
      - name: Login GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push в main: latest + автотег 0.1.<run_number> (как раньше).
      - name: Build & push (branch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: examples/stub-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/birdman-stub-server:latest
            ghcr.io/${{ github.repository_owner }}/birdman-stub-server:0.1.${{ github.run_number }}

      # workflow_dispatch: только явный semver-тег.
      - name: Build & push (release tag)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: examples/stub-server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/birdman-stub-server:${{ inputs.tag }}
