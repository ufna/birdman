name: secret-scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Полный скан истории на каждый пуш (репо маленький — секунды).
      # Не gitleaks-action: тот падает на первом пуше в пустой репо
      # (event.before=0000000 → битый диапазон), а нам нужен детерминизм.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest \
            git /repo --redact --verbose
