name: master

on:
  push:
    branches: [main]
    paths:
      - 'master/**'
      - 'proto/**'
      - '.github/workflows/master.yml'
  pull_request:
    paths:
      - 'master/**'
      - 'proto/**'
      - '.github/workflows/master.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: birdman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # Тесты берут DSN из env вместо самоподнятого docker-постгреса.
      BIRDMAN_TEST_DSN: postgres://postgres:birdman@localhost:5432/postgres?sslmode=disable
      # S3-интеграционные тесты (backup/s3) ходят в MinIO, поднятый шагом ниже.
      BIRDMAN_TEST_S3_ENDPOINT: http://localhost:9000
      BIRDMAN_TEST_S3_KEY: minioadmin
      BIRDMAN_TEST_S3_SECRET: minioadmin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            master/go.sum
            proto/go.sum

      - name: Start MinIO (S3 integration tests)
        run: |
          docker run -d --rm --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          # Явный health-probe: bounded-луп (15×1с); не поднялся — фейл шага.
          for _ in {1..15}; do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: MinIO did not become healthy on :9000" >&2
          exit 1

      - name: Vet & build proto
        working-directory: proto
        run: |
          go vet ./...
          go build ./...

      - name: Vet master
        working-directory: master
        run: go vet ./...

      - name: Test master (integration, Postgres 16)
        working-directory: master
        run: go test -race ./...

      - name: Build static linux/amd64 binaries
        working-directory: master
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags '-s -w' -o dist/birdman-master ./cmd/birdman-master
          go build -trimpath -ldflags '-s -w' -o dist/mmcli ./cmd/mmcli
          file dist/birdman-master dist/mmcli
