name: dev-build

# Пуш в main собирает платформу и публикует её OCI-артефактом в GHCR-пакет
# ghcr.io/<owner>/birdman-dev с подвижным тегом `dev`. Ни релизов, ни тегов
# репозитория: дев-стейт не должен выглядеть как обещание пользователям.
# Выкатывает НЕ этот workflow: на дев-боксе крутится pull-деплоер
# (infra/roles/birdman_devdeploy), который сам ходит за этим релизом,
# сверяет sha256, ставит и откатывается при провале health-gate.
#
# Почему pull, а не push: репозиторий публичный, и схема «CI заходит на бокс»
# означала бы приватный ключ к инфраструктуре в настройках публичного репо.
# Здесь секретов нет вообще — хватает встроенного GITHUB_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - 'master/**'
      - 'agent/**'
      - 'panel/**'
      - 'proto/**'
      - '.github/workflows/dev-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Burst из пушей схлопывается в последнюю сборку — та же семантика «только
# вперёд», что у auto_deploy версий: промежуточные на стенд не едут.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — agent/build.sh и наш VERSION опираются на git-историю.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      # Красная сборка на стенд не уезжает: тесты идут ДО публикации.
      # -timeout по той же причине, что в master.yml (tracker #1016): дефолт
      # `go test` — 600с на пакет, и `internal/httpapi` уже упирался в него на
      # том воркфлоу. Здесь запас больше (нет `-race`, а он и есть главный
      # множитель на bcrypt'е), но защёлка та же и сработала бы так же тихо —
      # с той разницей, что тут она остановила бы ВЫКАТ НА СТЕНД.
      - name: Test master
        run: cd master && go test -timeout 20m ./...

      - name: Test agent
        run: cd agent && go test ./...

      # Именно ./panel/build.sh, а не «npm run build» руками: сборка сама по
      # себе кладёт результат в panel/dist, а master встраивает go:embed'ом
      # ДРУГОЙ каталог — master/internal/panelui/static. Копирование делает
      # build.sh, и повторять его здесь значило бы держать вторую копию правды,
      # которая однажды разъедется (и разъехалась: CI-бинарь ушёл на стенд без
      # панели, отдавая placeholder «панель не была собрана в этот бинарь»).
      # node в раннере ≥20, поэтому build.sh идёт хостовым путём, без docker.
      - name: Build panel and stage it for go:embed
        run: ./panel/build.sh

      # Версия задаётся ЯВНО и обязана совпадать в трёх местах: ldflags агента,
      # поле agent_version в MANIFEST и тело POST /v1/agent-upgrade у деплоера.
      # Разъехались — watchdog мастера сверит re-Hello с чужой строкой и будет
      # слать ложные agent_upgrade_failed.
      # Гейт против того же класса поломки: собрать мастера без панели легко и
      # тихо (go:embed на пустом каталоге не падает — бинарь просто отдаёт
      # placeholder), а увидит это только человек, открывший панель.
      - name: Assert the panel is staged for embedding
        run: |
          set -euo pipefail
          test -s master/internal/panelui/static/index.html || {
            echo "панель не выложена в master/internal/panelui/static — бинарь уехал бы без неё"
            exit 1
          }

      - name: Build binaries
        id: build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          VERSION="dev-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          (cd master && go build -trimpath -ldflags "-s -w" -o ../dist/birdman-master ./cmd/birdman-master)
          (cd agent && go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../dist/birdman-agent ./cmd/birdman-agent)

      # Отдельные .sha256 больше не нужны: в OCI-артефакте digest блоба И ЕСТЬ
      # sha256 файла, и деплоер сверяет содержимое именно с ним.
      - name: Manifest
        env:
          AGENT_VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          {
            echo "commit=$GITHUB_SHA"
            echo "agent_version=$AGENT_VERSION"
            echo "run_id=$GITHUB_RUN_ID"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > MANIFEST
          cat MANIFEST

      # Дев-сборки НЕ становятся релизами: релиз — обещание пользователям, а
      # здесь чистый дев-стейт, и публичный репозиторий не должен им обрастать
      # (решение владельца 11.08.2026). Артефакты уезжают OCI-артефактом в
      # GHCR-пакет с подвижным тегом `dev` — Releases и теги остаются чистыми.
      #
      # oras ставится по закреплённой версии И сверенной sha256: скачанный из
      # сети бинарь, которому мы отдаём push-права на пакет, обязан быть тем
      # самым.
      - name: Install oras (pinned)
        run: |
          set -euo pipefail
          VER=1.2.3
          SHA=b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827
          curl -fsSL -o oras.tgz "https://github.com/oras-project/oras/releases/download/v${VER}/oras_${VER}_linux_amd64.tar.gz"
          echo "$SHA  oras.tgz" | sha256sum -c -
          tar -xzf oras.tgz oras
          sudo install -m 0755 oras /usr/local/bin/oras
          rm -f oras oras.tgz

      # Каждый файл кладётся ОТДЕЛЬНЫМ блобом (а не слоем-тарболом): его digest
      # и есть sha256 файла, поэтому деплоеру не нужны .sha256-ассеты — он
      # сверяет содержимое с именем содержимого. Плюс агент может скачать свой
      # бинарь одним GET'ом, без распаковки.
      - name: Push dev artifact to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/birdman-dev"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          cd dist
          oras push "$PKG:dev" \
            --artifact-type application/vnd.birdman.devbuild.v1 \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            birdman-master:application/octet-stream \
            birdman-agent:application/octet-stream \
            MANIFEST:text/plain
          echo "· опубликовано: $PKG:dev ($GITHUB_SHA)"

      # Прошлые сборки остаются в пакете безымянными версиями — подвижный тег
      # `dev` переезжает на новый манифест, старый остаётся лежать. Чистит их
      # ВСТРОЕННЫЙ токен, и это измерено, а не предположено.
      #
      # Здесь стояло обратное утверждение («встроенный GITHUB_TOKEN
      # пользовательские пакеты удалять не может»), и чистка пряталась за
      # необязательным PAT, то есть не работала никогда: на 14.08.2026 в пакете
      # накопилась 81 версия, из них 80 безымянных. Пробник с временной ветки
      # тем самым github.token: GET .../birdman-dev/versions → 200, DELETE самой
      # старой безымянной → 204, и её больше нет в листинге. Причина в том, что
      # пакет ПРИВЯЗАН к этому репозиторию (шаг публикации выше проставляет
      # org.opencontainers.image.source), поэтому им распоряжается токен репо, а
      # право несёт `packages: write` в permissions. Секретов в этом workflow
      # по-прежнему нет — как и обещает его шапка.
      #
      # Тег `dev` не трогаем никогда: удаляются только безымянные. Откату это
      # не мешает — деплоер откатывается на локальный .prev, а не перекачкой
      # старого дайджеста (infra/roles/birdman_devdeploy).
      - name: Prune untagged package versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Косметика не имеет права красить сборку: артефакт уже опубликован,
          # и сбой API здесь — повод для строчки в логе, а не для красного
          # билда. Отсюда `|| true` на самом запросе (pipefail иначе провалил бы
          # шаг вместе с джобой).
          ids="$(gh api --paginate "/user/packages/container/birdman-dev/versions" \
            --jq '.[] | select((.metadata.container.tags | length) == 0) | .id' 2>/dev/null || true)"
          if [ -z "$ids" ]; then
            echo "безымянных версий нет — пропускаю"
            exit 0
          fi
          echo "безымянных версий к удалению: $(printf '%s\n' "$ids" | wc -l)"
          for id in $ids; do
            gh api --method DELETE "/user/packages/container/birdman-dev/versions/$id" >/dev/null 2>&1 \
              && echo "· удалена безымянная версия $id" \
              || echo "· не смог удалить версию $id (право есть — значит сбой API, не доступ)"
          done
