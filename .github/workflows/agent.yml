name: agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  # Ручной прогон тестов (без публикаций — у агента их нет): удобно для
  # заполнения бейджа/переиспытания без изменения agent/**.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # Интеграционные тесты containerd (-tags integration) в CI не гоняются —
      # только компилируются vet'ом; запуск — на тачке (итерация 0, ansible).
      - name: Vet & test
        working-directory: agent
        run: |
          go vet ./...
          go vet -tags integration ./...
          go test -race ./...
