name: proto

# Три гейта контракта в одном джобе: «линт контракта» (tracker #1114),
# «совместимость внутри agentlink.v1» (tracker #1116) и «сгенерированное
# совпадает с исходником» (tracker #1110).
#
# `proto/agentlink/v1/*.pb.go` закоммичены (потребителям Go-модуля генератор не
# нужен), но генерировались только руками: до этого workflow НИ ОДИН джоб не
# запускал генерацию и не диффил её результат, так что разъезд между `.proto` и
# `.pb.go` заметить было нечем.
#
# С линтом была та же история наоборот: `proto/buf.yaml` держит осознанный набор
# правил (`STANDARD` минус четыре ИМЕНОВАННЫХ исключения, каждое с обоснованием
# прямо в том файле), `proto/README.md` документирует команду для человека — а
# гоняли её только руками, то есть никогда. Правила без сторожа не правила.
#
# Тулчейн берётся из `proto/protogen.Dockerfile` — ТОГО ЖЕ, что документирован
# в `proto/README.md` для человека. Пины (`buf 1.55.1`, `protoc-gen-go@v1.36.6`,
# `protoc-gen-go-grpc@v1.5.1`) намеренно НЕ дублируются в этом YAML: второй
# экземпляр пинов сам стал бы генератором ложного красного — бампнули
# Dockerfile, а CI продолжает требовать вывод старого генератора и краснеет
# ровно на легитимной регенерации. По той же причине линт живёт ЗДЕСЬ, а не в
# отдельном джобе: образ уже собран этим джобом, второй джоб пересобирал бы его
# целиком ради одной команды и завёл бы второй экземпляр пинов.
#
# Секция `breaking: use: FILE` из `proto/buf.yaml` теперь тоже гоняется, и база
# у неё НЕ скользящая (tracker #1116). Обоснование — у самого шага ниже.

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - 'infra/ci/proto-generated-check.sh'
      - '.github/workflows/proto.yml'
  pull_request:
    paths:
      - 'proto/**'
      - 'infra/ci/proto-generated-check.sh'
      - '.github/workflows/proto.yml'

permissions:
  contents: read

jobs:
  # Имя джоба общее, потому что гейтов в нём два. Джоб, который линтит контракт,
  # но зовётся `generated-matches-source`, врал бы про то, что делает.
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` — не «на всякий случай»: гейт совместимости ниже
      # достаёт точку заморозки `agentlink.v1` из ИСТОРИИ, а дефолтная глубина
      # чекаута — один коммит, и `git archive` на неё честно упадёт.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build pinned protogen image
        working-directory: proto
        run: docker build -t birdman-protogen -f protogen.Dockerfile .

      # ПЕРЕД генерацией, и это не косметика: правка `.proto`, нарушающая стиль,
      # роняет ОБА гейта разом. Линт первым — человек читает «правило и строка»;
      # линт последним — человек сначала упирается в диффы `.pb.go` и разбирается
      # не с той причиной.
      #
      # Ровно команда из proto/README.md, включая рабочий каталог. Правила и
      # список исключений живут в proto/buf.yaml и НЕ дублируются здесь.
      - name: Contract must pass buf lint
        working-directory: proto
        run: docker run --rm -v "$PWD":/workspace birdman-protogen lint

      # БАЗА — ТОЧКА ЗАМОРОЗКИ, А НЕ СКОЛЬЗЯЩАЯ. `proto/README.md` объявляет
      # `agentlink.v1` мажором контракта: «breaking change = новый `v2` рядом».
      # Это утверждение «внутри v1 несовместимости не бывает НИКОГДА», и база
      # обязана быть неподвижной, иначе гейт отвечает на другой вопрос — «не
      # сломали ли с прошлого раза».
      #
      # Почему НЕ `--against '.git#branch=main'`: на `push: main` это сравнение
      # с самим собой, а в этом репозитории работа регулярно едет ПРЯМЫМ пушем
      # в main. Замерено на клоне пинованным buf: ломающая правка (`hostname`
      # 2 → 7), закоммиченная прямо в main, против скользящей базы даёт код 0 —
      # гейт молчит ровно на основном пути доставки. Против точки заморозки та
      # же правка даёт 100. Почему НЕ тег: тегов в репозитории ноль, то есть это
      # ещё и обязательство их ставить плюс режим отказа «тега нет».
      #
      # Точка заморозки — РОЖДЕНИЕ мажора, самая строгая честная база. И она
      # ЗЕЛЁНАЯ на сегодняшнем дереве: весь рост контракта за ~460 коммитов
      # (Enroll, SetRegistries, RemoveImage, DrainServer, AllocateServer)
      # оказался строго аддитивным. Гейт включён зелёным и краснеет только на
      # нарушении объявленной политики, а не на механике: ни ребейз, ни
      # соседний коммит, ни бамп бота его не двигают.
      #
      # База МАТЕРИАЛИЗУЕТСЯ на раннере (`git archive`), а не берётся git-инпутом
      # buf'а: git-инпуту нужен `.git` ВНУТРИ контейнера (у соседних шагов
      # смонтирован только `proto/`), своя глубина клона и своё разбирательство
      # с `safe.directory` — три подвижных части там, где хватает каталога.
      # Вырожденная база не проходит молча: на пустом или отсутствующем каталоге
      # buf отвечает `Module "path: "."" had no .proto files` и кодом 1
      # (проверено), а `git archive` без пайпа роняет шаг сам.
      - name: Contract must stay backward compatible within agentlink.v1
        # Ровно команда из proto/README.md, включая рабочий каталог — как у
        # соседних шагов: у читателя один способ воспроизвести гейт руками.
        working-directory: proto
        env:
          # Коммит «proto: контракт agentlink v1 (gRPC master↔agent)» — момент,
          # когда мажор `agentlink.v1` появился. Сдвинуть базу можно только
          # правкой этой строки: акт видимый и ревьюируемый, в отличие от
          # молчаливого проезда.
          V1_FREEZE: 2d4ec93f68e4cd30b5bfe09c5f0f2adb93f5bded
        run: |
          base="$(mktemp -d)"
          # Без пайпа намеренно: `run` по умолчанию идёт под `bash -e` БЕЗ
          # pipefail, и в `git archive … | tar -x` отказ архиватора остался бы
          # незамеченным — база вышла бы пустой.
          # Pathspec `:/proto` — от КОРНЯ репозитория: шаг работает из proto/,
          # и голое `proto` тут не нашлось бы (`fatal: pathspec … did not match`).
          git archive "$V1_FREEZE" :/proto -o "$base/freeze.tar"
          tar -x -C "$base" -f "$base/freeze.tar"
          docker run --rm -v "$PWD":/workspace -v "$base":/baseline:ro \
            birdman-protogen breaking . --against /baseline

      - name: Drop generated files, then regenerate
        run: |
          # Удаление ПЕРЕД генерацией — не уборка, а закрытие дыры «молча
          # зелёный»: генерация, не произведшая ничего, но вышедшая нулём,
          # обязана дать УДАЛЕНИЯ (красное), а не чистое дерево.
          git ls-files -z -- 'proto/**/*.pb.go' | xargs -0 -r rm -f
          # Ровно команда из proto/README.md, включая рабочий каталог.
          cd proto
          docker run --rm -v "$PWD":/workspace birdman-protogen generate

      - name: Generated code must match source
        run: ./infra/ci/proto-generated-check.sh
