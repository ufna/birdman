name: proto

# Два гейта контракта в одном джобе: «линт контракта» (tracker #1114) и
# «сгенерированное совпадает с исходником» (tracker #1110).
#
# `proto/agentlink/v1/*.pb.go` закоммичены (потребителям Go-модуля генератор не
# нужен), но генерировались только руками: до этого workflow НИ ОДИН джоб не
# запускал генерацию и не диффил её результат, так что разъезд между `.proto` и
# `.pb.go` заметить было нечем.
#
# С линтом была та же история наоборот: `proto/buf.yaml` держит осознанный набор
# правил (`STANDARD` минус четыре ИМЕНОВАННЫХ исключения, каждое с обоснованием
# прямо в том файле), `proto/README.md` документирует команду для человека — а
# гоняли её только руками, то есть никогда. Правила без сторожа не правила.
#
# Тулчейн берётся из `proto/protogen.Dockerfile` — ТОГО ЖЕ, что документирован
# в `proto/README.md` для человека. Пины (`buf 1.55.1`, `protoc-gen-go@v1.36.6`,
# `protoc-gen-go-grpc@v1.5.1`) намеренно НЕ дублируются в этом YAML: второй
# экземпляр пинов сам стал бы генератором ложного красного — бампнули
# Dockerfile, а CI продолжает требовать вывод старого генератора и краснеет
# ровно на легитимной регенерации. По той же причине линт живёт ЗДЕСЬ, а не в
# отдельном джобе: образ уже собран этим джобом, второй джоб пересобирал бы его
# целиком ради одной команды и завёл бы второй экземпляр пинов.
#
# Секция `breaking: use: FILE` из `proto/buf.yaml` здесь НЕ гоняется осознанно:
# ей нужен baseline-ref (`--against` на `origin/main` или на тег), а это отдельный
# разговор про то, что считать базой (tracker #1116).

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - 'infra/ci/proto-generated-check.sh'
      - '.github/workflows/proto.yml'
  pull_request:
    paths:
      - 'proto/**'
      - 'infra/ci/proto-generated-check.sh'
      - '.github/workflows/proto.yml'

permissions:
  contents: read

jobs:
  # Имя джоба общее, потому что гейтов в нём два. Джоб, который линтит контракт,
  # но зовётся `generated-matches-source`, врал бы про то, что делает.
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned protogen image
        working-directory: proto
        run: docker build -t birdman-protogen -f protogen.Dockerfile .

      # ПЕРЕД генерацией, и это не косметика: правка `.proto`, нарушающая стиль,
      # роняет ОБА гейта разом. Линт первым — человек читает «правило и строка»;
      # линт последним — человек сначала упирается в диффы `.pb.go` и разбирается
      # не с той причиной.
      #
      # Ровно команда из proto/README.md, включая рабочий каталог. Правила и
      # список исключений живут в proto/buf.yaml и НЕ дублируются здесь.
      - name: Contract must pass buf lint
        working-directory: proto
        run: docker run --rm -v "$PWD":/workspace birdman-protogen lint

      - name: Drop generated files, then regenerate
        run: |
          # Удаление ПЕРЕД генерацией — не уборка, а закрытие дыры «молча
          # зелёный»: генерация, не произведшая ничего, но вышедшая нулём,
          # обязана дать УДАЛЕНИЯ (красное), а не чистое дерево.
          git ls-files -z -- 'proto/**/*.pb.go' | xargs -0 -r rm -f
          # Ровно команда из proto/README.md, включая рабочий каталог.
          cd proto
          docker run --rm -v "$PWD":/workspace birdman-protogen generate

      - name: Generated code must match source
        run: ./infra/ci/proto-generated-check.sh
