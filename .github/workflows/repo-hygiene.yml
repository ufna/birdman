name: repo-hygiene

# Гейт «в репозитории нет трекнутых исполняемых артефактов» (tracker #1112).
#
# 12.08 коммитом `bebbbac` в индекс случайным `git add` уехал 4.2 МБ ELF
# (`sdk/mockagent/mockagent`): собран go1.26.5 при пине `go-version: '1.24'`,
# `CGO_ENABLED=1` и `not stripped` при каноне `CGO_ENABLED=0 -trimpath -ldflags
# '-s -w'`, внутри — абсолютный путь другого чекаута владельца. Потребителей у
# файла не было ни одного, а сверял его с исходником никто: единственным шагом
# CI про mockagent был `go vet ./...`.
#
# БЕЗ paths-ФИЛЬТРА — СОЗНАТЕЛЬНО, и это единственное неочевидное решение здесь.
# Бинарь может приземлиться в ЛЮБОЙ каталог (наш уехал в `sdk/`), а все прочие
# workflow'ы репозитория отфильтрованы по путям — повесь эту проверку на любой
# из них, и на артефакт вне его слайса она не сработает НИКОГДА. Цена полного
# прогона — секунды: `git ls-files` плюс первые 8 байт каждого из ~570 файлов,
# ни докера, ни тулчейна.
#
# Сам чекер тестируется кейсами в `infra/ci/tests/run.sh` (гоняются джобом
# `infra`): и приёмка, и отказ, включая три класса ложного красного.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  no-tracked-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tracked executable artifacts
        run: ./infra/ci/no-tracked-binaries.sh
