<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>birdman — demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M3 14L12 8L21 14' stroke='%23D9541A' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M7 19.5L12 16L17 19.5' stroke='%23F0713A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Тема и язык до первого рендера — без вспышки не той темы/языка.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('birdman.theme');
          if (t === 'light' || t === 'dark') root.dataset.theme = t;
        } catch (e) {
          /* localStorage недоступен — остаёмся на системной теме */
        }
        try {
          var l = localStorage.getItem('birdman.lang');
          if (l !== 'en' && l !== 'ru') {
            var navs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            l = 'en';
            for (var i = 0; i < navs.length; i++) {
              if (navs[i] && navs[i].toLowerCase().indexOf('ru') === 0) { l = 'ru'; break; }
            }
          }
          root.lang = l;
        } catch (e) {
          /* остаёмся на en из разметки */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
