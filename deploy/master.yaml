# Конфиг birdman-master для self-host (docs/self-host.md). dsn приходит
# env-переменной BIRDMAN_DSN из compose (.env) — здесь его нет.

listen_api: ":8100"    # REST+панель; наружу хоста публикуется только 127.0.0.1 (compose)
listen_grpc: ":8444"   # gRPC agentlink (всегда TLS); ноды ходят сюда напрямую

# Строгий mTLS с первого дня: token-only Hello отвергается, ноды заходят
# Enroll-by-token → клиентский серт (внутренняя CA в Postgres).
agentlink_auth: mtls

# Ключ шифрования секретов at-rest (обязателен, fail-loud):
#   umask 077 && openssl rand -base64 32 > secrets.key
# Эскроу-копию — в менеджер паролей (restore-runbook: docs/specs/ops.md §5).
secrets_key_file: "/etc/birdman/secrets.key"

# Наблюдаемость (опционально): свои VictoriaMetrics/VictoriaLogs — укажи URL,
# и панель получит графики/логи. Референс стека: infra/roles/birdman_monitoring_dev.
#
# ОСТАВИТЬ БЛОК ЗАКОММЕНТИРОВАННЫМ — ЭТО НЕ «ПУСТО». Дефолт мастера непустой:
# те же http://127.0.0.1:8428 и :9428, что закомментированы ниже. Значит стоит
# на боксе референс-стек — вкладки просто заработают; не стоит ничего — они
# отвечают 502 upstream («апстрим недоступен»), а НЕ 503 («не настроено»).
# Панель эти два случая различает, так что 503 отправит чинить конфиг, а 502 —
# чинить стек, которого нет. Хочешь честное «не настроено» — раскомментируй
# блок и поставь ЯВНУЮ пустую строку: victoriametrics_url: "".
#
# Ещё три причины пустого/красного экрана, и все не про 503:
#  * привязанный к паре (project, env) ключ получает 200, но master сужает его
#    запрос этой парой — графики и логи без пары в данных придут ПУСТЫМИ, без
#    ошибки. У логов пару чеканит агент под флагом log_scope_dirs (дефолт
#    БИНАРЯ агента — выкл.; ansible-роль birdman_agent_dev ставит true), так что
#    до включения разметки истории у привязанного ключа нет вовсе;
#  * апстрим, который не разбирает ручку сужения (версия, которая её не знает —
#    наши роли пинят VL v1.51.0 / VM v1.102.1; Loki-совместимая подмена; прокси,
#    режущий query), привязанному ключу отвечает 503 logs_narrowing_unsupported /
#    metrics_narrowing_unsupported — отказ вместо чужих данных. Замерено: на том
#    же апстриме глобальный и admin-ключ получают 200 со всем флотом, они мимо
#    пробы (сужать их нечем). Саму ВЕРСИЮ master не читает никогда — он проверяет
#    только, разбирается ли ручка;
#  * ключ без скоупа readonly/admin → 403, и это про скоуп, а не про привязку.
# Полностью — docs/self-host.ru.md §4 «Кто что видит» (EN: docs/self-host.md
# §4 "Who sees what").
# metrics:
#   victoriametrics_url: "http://127.0.0.1:8428"
#   victorialogs_url: "http://127.0.0.1:9428"

# alerts:
#   alertmanager_url: "http://127.0.0.1:9093"  # зеркалирование mute → alertmanager silence (best-effort);
#                                              # дефолт и так этот URL: без стека тихо деградирует до v0, "" — выключить явно

# backups:                       # Backups v1: политика (интервал/ретеншны/S3) — в панели;
#   dir: /var/lib/birdman/backups  # здесь только деплой-концерны (дефолты менять не нужно)
#   pg_dump_path: pg_dump
