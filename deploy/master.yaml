# Конфиг birdman-master для self-host (docs/self-host.md). dsn приходит
# env-переменной BIRDMAN_DSN из compose (.env) — здесь его нет.

listen_api: ":8100"    # REST+панель; наружу хоста публикуется только 127.0.0.1 (compose)
listen_grpc: ":8444"   # gRPC agentlink (всегда TLS); ноды ходят сюда напрямую

# Строгий mTLS с первого дня: token-only Hello отвергается, ноды заходят
# Enroll-by-token → клиентский серт (внутренняя CA в Postgres).
agentlink_auth: mtls

# Ключ шифрования секретов at-rest (обязателен, fail-loud):
#   umask 077 && openssl rand -base64 32 > secrets.key
# Эскроу-копию — в менеджер паролей (restore-runbook: docs/specs/ops.md §5).
secrets_key_file: "/etc/birdman/secrets.key"

# Наблюдаемость (опционально): свои VictoriaMetrics/VictoriaLogs — укажи URL,
# и панель получит графики/логи. Пусто → эти вкладки отвечают 503, всё
# остальное работает. Референс стека: infra/roles/birdman_monitoring_dev.
#
# 503 — не единственная причина пустого экрана, и вторая важнее для оператора:
# сессия под ключом, ПРИВЯЗАННЫМ к паре (project, env), получает 200, но master
# сужает её запрос этой парой, поэтому графики и логи без пары в данных придут
# ПУСТЫМИ, без ошибки. У логов пару чеканит агент под флагом log_scope_dirs
# (дефолт БИНАРЯ агента — выкл.; ansible-роль birdman_agent_dev ставит его в
# true) — до включения разметки у привязанного ключа истории нет вовсе.
# Полностью — docs/self-host.ru.md §4 «Кто что видит» (EN: docs/self-host.md
# §4 "Who sees what").
# metrics:
#   victoriametrics_url: "http://127.0.0.1:8428"
#   victorialogs_url: "http://127.0.0.1:9428"

# alerts:
#   alertmanager_url: "http://127.0.0.1:9093"  # зеркалирование mute → alertmanager silence (best-effort);
#                                              # дефолт и так этот URL: без стека тихо деградирует до v0, "" — выключить явно

# backups:                       # Backups v1: политика (интервал/ретеншны/S3) — в панели;
#   dir: /var/lib/birdman/backups  # здесь только деплой-концерны (дефолты менять не нужно)
#   pg_dump_path: pg_dump
