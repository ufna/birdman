syntax = "proto3";

package agentlink.v1;

option go_package = "github.com/ufna/birdman/proto/agentlink/v1;agentlinkv1";

// AgentLink is the bidirectional control channel between birdman-master and
// birdman-agent. The agent dials master (outbound only, TLS) and keeps a
// single Session stream open. The first AgentMsg on the stream MUST be Hello.
//
// Delivery semantics: every command in MasterMsg carries a cmd_id; the agent
// confirms execution with Ack{cmd_id} (or a ServerEvent describing the
// failure). Master re-sends unacknowledged commands on reconnect, so command
// handling on the agent must be idempotent by cmd_id (at-least-once).
service AgentLink {
  rpc Session(stream AgentMsg) returns (stream MasterMsg);
  // Enroll (mTLS v1, аддитивно) — unary-обмен node_token → клиентский
  // сертификат на том же gRPC-листенере, что и Session. Это НЕ команда:
  // cmd_id/Ack/pending-машинерия не участвуют (обычный запрос-ответ).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// EnrollRequest — заявка ноды на клиентский сертификат
// (docs/superpowers/specs/2026-07-10-mtls-agentlink-design.md §2). Две роли:
//   * bootstrap/recovery — node_token заполнен (bcrypt-проверка, как в Hello);
//   * renewal — node_token ПУСТОЙ: авторизация по действующему клиентскому
//     серту поверх уже установленной mTLS-сессии соединения.
// Приватный ключ генерит агент и НИКОГДА не отдаёт: csr_pem несёт только
// публичный ключ + доказательство владения (master проверяет подпись CSR;
// subject CSR игнорируется — CN проставляет master из аутентифицированной
// идентичности). Ни node_token, ни материал ключей никогда не логируются.
message EnrollRequest {
  string node_token    = 1; // bootstrap/recovery; ПУСТОЙ при renewal по действующему client-серту
  bytes  csr_pem       = 2; // PKCS#10; ключ генерит агент, приватный ключ никогда не покидает ноду
  string agent_version = 3; // наблюдаемость (лог/событие)
}

// EnrollResponse — подписанный master'ом ответ на заявку. cert_pem/ca_bundle_pem
// — публичные серты (не секреты); срок берётся из not_after_unix, окно renewal
// агент считает сам.
message EnrollResponse {
  bytes cert_pem       = 1; // подписанный клиентский серт, CN = node_id
  bytes ca_bundle_pem  = 2; // текущий траст-бандл CA (задел под ротацию CA без ansible)
  int64 not_after_unix = 3; // срок действия выданного листа (unix seconds)
}

message AgentMsg {
  oneof msg {
    Hello hello = 1; // first message in the stream
    Heartbeat heartbeat = 2;
    ServerEvent event = 3;
    LogChunk log = 4; // response to TailLogs
    PullReport pull = 5; // progress/result of PrePull
    Ack ack = 6; // confirms a master command by cmd_id
    ImageReport image_report = 7; // result of RemoveImage
  }
}

message Hello {
  string node_token = 1;
  string hostname = 2;
  string region = 3;
  int32 capacity_slots = 4;
  string agent_version = 5;
  repeated ServerState servers = 6; // recovered map after agent restart
}

message Heartbeat {
  int64 ts_unix_ms = 1;
  NodeStats node = 2;
  repeated ServerState servers = 3;
}

message NodeStats {
  float cpu = 1;
  uint64 mem_used = 2;
  uint64 mem_total = 3;
  uint64 disk_used = 4;
  uint64 disk_total = 5;
  float load1 = 6;
  // draining (iteration 4, additive): the agent acknowledged a node-level
  // Drain and rejects new StartServer commands. Informational — node state
  // in the master's DB stays authoritative.
  bool draining = 7;
}

message ServerState {
  string server_id = 1;
  string state = 2; // pulling|starting|ready|allocated|draining|stopped|failed
  int32 players = 3;
  float tick_ms = 4;
  string match_id = 5;
  int32 port = 6;
  string version = 7;
}

message ServerEvent {
  string server_id = 1;
  string kind = 2; // failed|oom|ready|match_start|match_end
  string detail = 3;
}

message LogChunk {
  string cmd_id = 1; // TailLogs command this chunk answers
  string server_id = 2;
  bytes data = 3;
  bool eof = 4; // no more chunks will follow
}

message PullReport {
  string cmd_id = 1; // PrePull command this report answers
  string image_ref = 2;
  string status = 3; // pulling|pulled|failed
  string detail = 4; // progress info or error text
}

// ImageReport carries the RESULT of one RemoveImage back to the master
// (environments v1 §6б). Ack{cmd_id} only confirms receipt — it has no result
// field and is deliberately not extended — so without this message the master
// stamped its «догоняющая команда отправлена» marker (versions.image_cleanup_at)
// blind, and a busy/errored removal was never retried. The agent sends EXACTLY
// ONE ImageReport per RemoveImage it handles (the Ack stays a separate, ordinary
// recv-loop message):
//
//	removed — the image was deleted from the node's store;
//	absent  — nothing to delete (already gone: replay, or the watermark GC won);
//	busy    — the ref still backs a live container (the version's servers are
//	          still draining) — nothing was deleted;
//	error   — the removal failed; detail carries the error text.
//
// The master marks a version's image as retired only when EVERY target node of
// its (project, env) reported removed|absent; busy/error leave the version
// unmarked, so the next cleanup subtick sends RemoveImage again (idempotent — an
// absent image is a no-op). detail is empty unless status = error.
message ImageReport {
  string cmd_id = 1;
  string image_ref = 2;
  string status = 3; // removed|absent|busy|error
  string detail = 4; // error text for status=error, otherwise empty
}

message Ack {
  string cmd_id = 1;
}

message MasterMsg {
  oneof msg {
    StartServer start = 1;
    StopServer stop = 2;
    PrePull prepull = 3;
    Drain drain = 4; // node-level: stop creating, let matches finish
    UpgradeAgent upgrade = 5;
    TailLogs tail = 6;
    Ack ack = 7; // reserved for master-side acknowledgements
    AllocateServer allocate = 8; // iteration 2: deliver a match to the dedik
    DrainServer drain_server = 9; // iteration 3: per-server drain (deploy reap)
    Undrain undrain = 10; // iteration 4: lift the node-level drain
    SetRegistries set_registries = 11; // registries v1: private-registry credential snapshot for image pulls
    RemoveImage remove_image = 12; // environments v1: retire a disabled version's image from the node
  }
}

// RemoveImage retires one image from the node when a version goes disabled
// (environments v1, docs/superpowers/specs/2026-07-13-environments-v1-design.md
// §6б): the master sends it to every node of the (project, env) over the
// existing at-least-once FIFO queue whenever a version transitions to disabled
// (demote of the older deprecated on an activate flip — the main dev-stream
// path — plus TTL and retention). The agent handles it like PrePull: dispatch
// returns immediately (the plain Ack confirms receipt, this message does NOT
// extend Ack) and the work runs in a goroutine — an image referenced by a live
// container is logged and skipped (the watermark GC picks it up later; the
// master is not told), an absent image is a no-op (idempotent under replay),
// otherwise the image is deleted synchronously and its ref dropped from the GC
// protected set. A deprecated version's image is never removed (the rollback
// window stays warm); missed removals self-heal (EnsureImage re-pulls on
// StartServer). The guard against shared refs (same image_ref still referenced
// by a non-disabled version of the same project/env) lives on the master.
message RemoveImage {
  string cmd_id = 1;
  string image_ref = 2;
}

// SetRegistries carries the full set of private-registry credentials the
// agent should use for image pulls (docs/superpowers/specs/2026-07-09-registries-design.md
// §2; master admin API POST/DELETE /v1/registries). This is a full snapshot,
// not a diff: every delivery replaces the agent's in-memory credential set
// entirely. Master sends it to a newly-attached agent BEFORE replaying any
// pending commands (so a replayed StartServer/PrePull for a private image
// never races ahead of the credentials and falls back to an anonymous pull),
// and broadcasts it to every connected agent whenever the registry set
// changes. The agent keeps the set only in memory — never written to disk —
// and the token is never logged, never placed in an audit event payload, and
// never returned by a GET.
message SetRegistries {
  string cmd_id = 1; // required: all ack/re-send machinery keys off cmd_id
  repeated RegistryCred registries = 2; // full snapshot (replace, not diff)
}

// RegistryCred is one private-registry credential, host-matched by the agent
// against the host parsed out of image_ref (docs/superpowers/specs/2026-07-09-registries-design.md
// §3). token is plaintext over agentlink's TLS transport and in the agent's
// memory — it must never be logged.
message RegistryCred {
  string host = 1; // normalized: lowercase, no scheme, no path/slash (master store.NormalizeRegistryHost)
  string username = 2;
  string token = 3; // never logged
}

// Undrain lifts a node-level Drain (iteration 4, POST /v1/nodes/{id}/undrain):
// the agent clears its draining flag and accepts StartServer again.
message Undrain {
  string cmd_id = 1;
}

// DrainServer asks ONE dedicated server to finish its current match and exit
// (iteration 3, deploy manager reap of deprecated versions —
// docs/specs/master.md §5). The agent moves the server to `draining`,
// forwards the `drain{deadline_s, reason}` frame to liba over the per-server
// socket (docs/specs/protocol.md §2) and replays it to a (re)connecting liba.
// Unlike StopServer no signal is sent: the dedik plays the match out and
// exits on its own; deadline_s is the in-game deadline for liba.
message DrainServer {
  string cmd_id = 1;
  string server_id = 2;
  int32 deadline_s = 3;
  string reason = 4;
}

// AllocateServer tells the node's agent that master allocated a match to
// server_id: the agent forwards the `allocated{match_id, players_expected}`
// frame to liba over the per-server socket (docs/specs/protocol.md §2) and
// remembers it for liba reconnect replay. Sent after every successful
// allocation — both REST POST /v1/allocate and the built-in matchmaker.
// players_expected = 0 means "unknown" (external matchmaker did not say).
// metadata rides through verbatim to liba's `allocated.metadata` (the SDK has
// carried the field since the v0 freeze; the wire finally fills it): the
// external matchmaker's per-match payload — a join secret, a mode, a map
// name. Small by contract: the master caps keys/sizes at the REST door, and
// the agent never reads it. Absent/empty for the built-in matchmaker.
message AllocateServer {
  string cmd_id = 1;
  string server_id = 2;
  string match_id = 3;
  int32 players_expected = 4;
  map<string, string> metadata = 5;
}

message StartServer {
  string server_id = 1;
  string image_ref = 2;
  map<string, string> env = 3;
  Limits limits = 4;
  int32 port = 5; // 0 → agent picks a port from its pool
  string cmd_id = 6;
}

message Limits {
  int32 cpu_millis = 1;
  int32 mem_mb = 2;
}

message StopServer {
  string server_id = 1;
  int32 grace_s = 2;
  string cmd_id = 3;
}

message PrePull {
  string cmd_id = 1;
  string image_ref = 2;
}

message Drain {
  string cmd_id = 1;
  string reason = 2;
}

message UpgradeAgent {
  string cmd_id = 1;
  string url = 2;
  string sha256 = 3;
  string version = 4;
}

message TailLogs {
  string cmd_id = 1;
  string server_id = 2;
  bool follow = 3;
  // cancel_cmd_id (iteration 4, additive): when set, this message carries no
  // new tail request — it cancels the running tail started by that cmd_id
  // (the REST client of the master's logs proxy disconnected).
  string cancel_cmd_id = 4;
  // tail_lines (iteration 4, additive): > 0 → start from the last N lines of
  // the log instead of the beginning.
  int32 tail_lines = 5;
}
