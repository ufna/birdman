# Конфиг birdman-master (см. docs/specs/master.md §7; дев-дефолты v0).
# Любое поле можно переопределить env-переменными:
#   BIRDMAN_DSN, BIRDMAN_LISTEN_API, BIRDMAN_LISTEN_GRPC, BIRDMAN_VM_URL,
#   BIRDMAN_VL_URL, BIRDMAN_VMALERT_URL, BIRDMAN_ALERTMANAGER_URL,
#   BIRDMAN_SECRETS_KEY_FILE.

dsn: "postgres://postgres:birdman@localhost:5432/birdman?sslmode=disable"

listen_api: ":8100"   # REST API (+ /healthz); /metrics здесь НЕТ — см. ниже
# Прометеевская экспозиция — отдельный адрес (tracker #1003): реестр не
# пер-тенантный и не аутентифицирован (скрейперу нечем носить ключ), поэтому его
# границей служит адрес. Ключ отсутствует → дефолт 127.0.0.1:9102; ЯВНЫЙ пустой
# → экспозиции нет вовсе. Env-override BIRDMAN_LISTEN_METRICS.
listen_metrics: "127.0.0.1:9102"
listen_grpc: ":8444"  # gRPC AgentLink (всегда TLS)

# Ключ шифрования обратимых секретов at-rest (registries.token,
# internal_ca.key_pem) — AEAD AES-256-GCM, конверт birdman:v1:... в тех же
# колонках (secrets-encryption design §2). Файл: base64 32 случайных байт, одна
# строка, 0600 (генерится ansible один раз: `openssl rand -base64 32`). Мастер
# ОБЯЗАН иметь ключ — без него не стартует (расшифровать секреты нечем) и НИКОГДА
# не генерит его сам. Права шире 0600 → WARN (не фейл).
#   Env-override пути: BIRDMAN_SECRETS_KEY_FILE.
#   Dev/CI: вместо файла можно задать сам ключ значением через BIRDMAN_SECRETS_KEY
#   (base64) — оно выигрывает у secrets_key_file (dev-compose, где нет
#   /etc/birdman). См. restore-runbook (ops.md §5): эскроу-копию ключа положить
#   ДО старта мастера против восстановленной БД, иначе key_id-mismatch.
secrets_key_file: "/etc/birdman/secrets.key"

# Наблюдаемость: read-only прокси метрик и логов для панели (итерация 4 + Логи
# v1; модель доступа — master.md §6). Панель берёт графики из VictoriaMetrics и
# историю логов из VictoriaLogs через master, не ходя в TSDB/VL напрямую.
#
# ДЕФОЛТ ЭТИХ ДВУХ КЛЮЧЕЙ — НЕ ПУСТО, а те же :8428/:9428, что стоят ниже
# (config.defaults()). Убрать секцию metrics: целиком — НЕ то же самое, что
# «выключить наблюдаемость»: дефолты подставятся, и master пойдёт на локальные
# порты. Стоит там референс-стек — работает; не стоит ничего — 502 upstream, а
# НЕ 503. Пустая строка ("") — единственный способ сказать «не настроено».
#
# Три ручки — GET /v1/metrics/query, /v1/metrics/query_range, /v1/logs/query —
# отвечают по одной модели, и у неё ТРИ разных отказа со стороны апстрима, а не
# один: «не настроено» (503 *_unconfigured), «апстрим не умеет сужать» (503
# *_narrowing_unsupported, tracker #1007) и «апстрим не отвечает» (502). Панель
# разводит их: 503 *_unconfigured → мягкое «не настроено», 502/upstream →
# «недоступно» (panel lib/metrics.ts, lib/logsHistory.ts), а у narrowing на
# экране метрик своя строка каталога metric.err.narrowing (MetricMessage.tsx).
# Поэтому путать их в доке дорого: 503 отправляет оператора чинить конфиг,
# 502 — чинить стек.
#
# Порядок ниже — тот, в каком проверяет код (ops.go proxyVictoria/handleLogsQuery),
# ЗАМЕРЕН запуском, а не выведен чтением: РАЗРЕШЕНИЕ раньше состояния апстрима,
# иначе 403 рассказывал бы, настроена ли проксия (master.md §6):
#   * ключа нет → 401 unauthorized;
#   * гейт скоупа: ключ без readonly/admin → 403 `scope readonly required`.
#     К привязке отношения не имеет, был всегда, и выигрывает у ВСЕГО ниже;
#   * привязка непригодна к сужению (пара не проходит алфавит слага) → 403
#     fail-closed. Это ЕДИНСТВЕННЫЙ 403 из-за привязки: сама по себе привязка
#     эти ручки НЕ закрывает (было так до tracker #990, отменено #994);
#   * URL апстрима — ЯВНО пустая строка → 503 metrics_unconfigured /
#     logs_unconfigured (см. абзац про дефолт выше);
#   * кривой limit у logs-проксии → 400 bad_request. Стоит ПОСЛЕ 503
#     unconfigured, но РАНЬШЕ всего, что связано с апстримом: апстрима такой
#     запрос не касается вовсе. У metrics-проксий валидации limit нет — им он
#     не ручка, а часть проброшенного запроса;
#   * дальше — только для ПРИВЯЗАННОГО ключа: master сверяется с канарейкой,
#     разбирает ли апстрим ручку сужения (tracker #1007), потому что сужение
#     исполняет апстрим, а незнакомый query-параметр HTTP молча игнорирует.
#     Ручку проглотил (старая версия, Loki-совместимая подмена, прокси, режущий
#     query) → 503 metrics_narrowing_unsupported / logs_narrowing_unsupported;
#     вердикта нет (канарейка не доехала) → 502 upstream. Глобальный и admin
#     ключ мимо пробы — сужать их нечем;
#   * апстрим не отвечает на боевой запрос → 502 upstream;
#   * иначе 200 — но привязанному ключу master СУЖАЕТ запрос его парой
#     (tracker #994): extra_stream_filters у VL, парные extra_label у VM.
#     Чужого он не получит, но и своё увидит только там, где пара есть в
#     данных, — иначе 200 с ПУСТОЙ выдачей, а не ошибка. У логов пару чеканит
#     агент в путь файла под флагом log_scope_dirs (agent.md §5; дефолт БИНАРЯ
#     агента — false, наша ansible-роль birdman_agent_dev ставит true), так что
#     история до включения разметки привязанному ключу не видна вовсе.
# Непривязанный (глобальный/admin) ключ ходит во все три как раньше. Verbatim —
# это ДВЕ metrics-ручки из трёх: их query-строка уезжает в VM как есть. У
# logs-проксии verbatim не бывает ни у кого: limit master ставит сам (деф. 1000)
# и клампит потолком 10000 — ЛЮБОМУ ключу, включая глобальный.
metrics:
  victoriametrics_url: "http://127.0.0.1:8428"
  # Централизованные логи дедиков (Логи v1, GET /v1/logs/query), read-only
  # прокси в VictoriaLogs. Модель отказа и сужения — та же, что выше.
  victorialogs_url: "http://127.0.0.1:9428"

# Алерты для панели П2 (panel.md §3, ops.md §1). Правила и активные срабатывания
# — из vmalert HTTP API; история — из лог-сина алертов на боксе. Read-only в v0.
# Пусто vmalert_url → /v1/alerts/rules и /active отвечают 503; нет лог-файла →
# /v1/alerts/history отдаёт пустой список (не 500).
alerts:
  vmalert_url: "http://127.0.0.1:8880"
  log_path: "/var/log/birdman/alerts.log"
  # Зеркалирование mute → настоящий alertmanager silence (best-effort): mute из
  # панели создаёт реальный silence, sink/Discord замолкают (не только muted:true).
  # Дефолт — AM на том же боксе; недоступный AM НИКОГДА не ломает mute/unmute.
  # Пусто "" → зеркалирование выключено, mute-аннотации работают как раньше (v0).
  alertmanager_url: "http://127.0.0.1:9093"

# Режим аутентификации agentlink-листенера (mTLS agentlink v1, §3):
#   token — клиентские серты игнорируются (поведение до mTLS, байт-в-байт; экстренный откат);
#   mixed — Session принимает верифицированный клиентский серт ИЛИ node_token (дефолт, переходный период);
#   mtls  — Session требует клиентский серт (token-only Hello → PermissionDenied; Enroll по токену остаётся).
# Env-override: BIRDMAN_AGENTLINK_AUTH.
agentlink_auth: "mixed"

tls:
  # Внешние серты для gRPC-листенера. Если ОБА пусты — master сам выпускает
  # server-лист от внутренней CA (в памяти, hot-rotate; mTLS agentlink v1 §1);
  # клиентские серты нод листенер проверяет по внутренней CA независимо от того,
  # свой лист или внешний.
  cert_file: ""
  key_file: ""
  # auto_cert_dir больше не используется (self-signed автоген выведен из
  # эксплуатации в §1); оставлено принятым для совместимости старых конфигов.
  auto_cert_dir: "certs"
  # Доп. SAN'ы для выпускаемого server-листа (DNS или IP, для внешних probe'ов).
  # Агентам не нужны — они верят master'у по ServerName "birdman-master".
  extra_sans: []
  #  - "master.internal"
  #  - "10.0.0.5"

stats_rollup_interval: 2m  # период пересчёта хвоста match_stats_daily/ccu_daily (панель П2 Statistics)

node_down_after_min: 10   # quarantine дольше N минут → down + событие node_down (heartbeat живой сессии вернёт в active; dead — ручная ревокация, не отсюда)

matchmaking:
  tick_ms: 500          # период тика очередей
  widen_after_s: 30     # расширение на следующий по rtt регион игрока
  ticket_ttl_s: 120     # queued дольше → expired (клиент ре-квьюится)
  default_project: ""   # пусто: project из тикета либо единственный в БД
  join_token:
    enabled: false      # HMAC join_token в matched-ответе (master.md §4)
    secret: ""          # НЕ класть секрет в файл — env BIRDMAN_MM_JOIN_SECRET

# Совместимость клиент↔сервер (docs/specs/ops.md §3).
compat:
  default: "major.minor"  # единственное поддерживаемое правило (можно опустить)
  overrides: []           # окна миграции, аддитивно к default:
  # - client: "1.4.x"             # клиенты 1.4.* могут играть ещё и на...
  #   servers: ["1.4.x", "1.5.x"] # ...серверах 1.4.* и 1.5.*
