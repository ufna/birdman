# Конфиг birdman-master (см. docs/specs/master.md §7; дев-дефолты v0).
# Любое поле можно переопределить env-переменными:
#   BIRDMAN_DSN, BIRDMAN_LISTEN_API, BIRDMAN_LISTEN_GRPC, BIRDMAN_VM_URL,
#   BIRDMAN_VL_URL, BIRDMAN_VMALERT_URL, BIRDMAN_ALERTMANAGER_URL,
#   BIRDMAN_SECRETS_KEY_FILE.

dsn: "postgres://postgres:birdman@localhost:5432/birdman?sslmode=disable"

listen_api: ":8100"   # REST API (+ /metrics, /healthz)
listen_grpc: ":8444"  # gRPC AgentLink (всегда TLS)

# Ключ шифрования обратимых секретов at-rest (registries.token,
# internal_ca.key_pem) — AEAD AES-256-GCM, конверт birdman:v1:... в тех же
# колонках (secrets-encryption design §2). Файл: base64 32 случайных байт, одна
# строка, 0600 (генерится ansible один раз: `openssl rand -base64 32`). Мастер
# ОБЯЗАН иметь ключ — без него не стартует (расшифровать секреты нечем) и НИКОГДА
# не генерит его сам. Права шире 0600 → WARN (не фейл).
#   Env-override пути: BIRDMAN_SECRETS_KEY_FILE.
#   Dev/CI: вместо файла можно задать сам ключ значением через BIRDMAN_SECRETS_KEY
#   (base64) — оно выигрывает у secrets_key_file (dev-compose, где нет
#   /etc/birdman). См. restore-runbook (ops.md §5): эскроу-копию ключа положить
#   ДО старта мастера против восстановленной БД, иначе key_id-mismatch.
secrets_key_file: "/etc/birdman/secrets.key"

# Наблюдаемость: read-only прокси метрик для панели (итерация 4, panel.md §1.3).
# Панель берёт графики из VictoriaMetrics через master (GET /v1/metrics/query,
# /query_range), не ходя в TSDB напрямую. Пусто → эндпоинты отвечают 503.
metrics:
  victoriametrics_url: "http://127.0.0.1:8428"
  # Централизованные логи дедиков (Логи v1, GET /v1/logs/query), read-only
  # прокси в VictoriaLogs. Пусто → эндпоинт отвечает 503 logs_unconfigured.
  victorialogs_url: "http://127.0.0.1:9428"

# Алерты для панели П2 (panel.md §3, ops.md §1). Правила и активные срабатывания
# — из vmalert HTTP API; история — из лог-сина алертов на боксе. Read-only в v0.
# Пусто vmalert_url → /v1/alerts/rules и /active отвечают 503; нет лог-файла →
# /v1/alerts/history отдаёт пустой список (не 500).
alerts:
  vmalert_url: "http://127.0.0.1:8880"
  log_path: "/var/log/birdman/alerts.log"
  # Зеркалирование mute → настоящий alertmanager silence (best-effort): mute из
  # панели создаёт реальный silence, sink/Discord замолкают (не только muted:true).
  # Дефолт — AM на том же боксе; недоступный AM НИКОГДА не ломает mute/unmute.
  # Пусто "" → зеркалирование выключено, mute-аннотации работают как раньше (v0).
  alertmanager_url: "http://127.0.0.1:9093"

# Режим аутентификации agentlink-листенера (mTLS agentlink v1, §3):
#   token — клиентские серты игнорируются (поведение до mTLS, байт-в-байт; экстренный откат);
#   mixed — Session принимает верифицированный клиентский серт ИЛИ node_token (дефолт, переходный период);
#   mtls  — Session требует клиентский серт (token-only Hello → PermissionDenied; Enroll по токену остаётся).
# Env-override: BIRDMAN_AGENTLINK_AUTH.
agentlink_auth: "mixed"

tls:
  # Внешние серты для gRPC-листенера. Если ОБА пусты — master сам выпускает
  # server-лист от внутренней CA (в памяти, hot-rotate; mTLS agentlink v1 §1);
  # клиентские серты нод листенер проверяет по внутренней CA независимо от того,
  # свой лист или внешний.
  cert_file: ""
  key_file: ""
  # auto_cert_dir больше не используется (self-signed автоген выведен из
  # эксплуатации в §1); оставлено принятым для совместимости старых конфигов.
  auto_cert_dir: "certs"
  # Доп. SAN'ы для выпускаемого server-листа (DNS или IP, для внешних probe'ов).
  # Агентам не нужны — они верят master'у по ServerName "birdman-master".
  extra_sans: []
  #  - "master.internal"
  #  - "10.0.0.5"

stats_rollup_interval: 2m  # период пересчёта хвоста match_stats_daily/ccu_daily (панель П2 Statistics)

node_down_after_min: 10   # quarantine дольше N минут → down + событие node_down (heartbeat живой сессии вернёт в active; dead — ручная ревокация, не отсюда)

matchmaking:
  tick_ms: 500          # период тика очередей
  widen_after_s: 30     # расширение на следующий по rtt регион игрока
  ticket_ttl_s: 120     # queued дольше → expired (клиент ре-квьюится)
  default_project: ""   # пусто: project из тикета либо единственный в БД
  join_token:
    enabled: false      # HMAC join_token в matched-ответе (master.md §4)
    secret: ""          # НЕ класть секрет в файл — env BIRDMAN_MM_JOIN_SECRET

# Совместимость клиент↔сервер (docs/specs/ops.md §3).
compat:
  default: "major.minor"  # единственное поддерживаемое правило (можно опустить)
  overrides: []           # окна миграции, аддитивно к default:
  # - client: "1.4.x"             # клиенты 1.4.* могут играть ещё и на...
  #   servers: ["1.4.x", "1.5.x"] # ...серверах 1.4.* и 1.5.*
