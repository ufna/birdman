components:
  schemas:
    httpapi.activeAlert:
      type: object
      properties:
        active_at:
          type: string
          format: date-time
        description:
          type: string
        description_ru:
          type: string
        muted:
          type: boolean
        name:
          type: string
        node:
          type: string
        project:
          type: string
        region:
          type: string
        scope:
          type: string
        severity:
          type: string
        state:
          type: string
        value:
          type: string
      required:
        - active_at
        - description
        - muted
        - name
        - node
        - project
        - region
        - scope
        - severity
        - state
        - value
    httpapi.activeAlertsResp:
      type: object
      properties:
        alerts:
          type:
            - array
            - "null"
          items:
            $ref: '#/components/schemas/httpapi.activeAlert'
      required:
        - alerts
    httpapi.alertEvent:
      type: object
      properties:
        active:
          type: boolean
        description:
          type: string
        description_ru:
          type: string
        endsAt:
          type: string
        muted:
          type: boolean
        name:
          type: string
        node:
          type: string
        project:
          type: string
        received_at:
          type: string
        region:
          type: string
        scope:
          type: string
        severity:
          type: string
        startsAt:
          type: string
      required:
        - active
        - description
        - endsAt
        - muted
        - name
        - node
        - project
        - region
        - scope
        - severity
        - startsAt
    httpapi.alertHistoryResp:
      type: object
      properties:
        alerts:
          type:
            - array
            - "null"
          items:
            $ref: '#/components/schemas/httpapi.alertEvent'
      required:
        - alerts
    httpapi.alertMuteResp:
      type: object
      properties:
        mute:
          $ref: '#/components/schemas/store.AlertMute'
      required:
        - mute
    httpapi.alertMutesResp:
      type: object
      properties:
        mutes:
          type:
            - array
            - "null"
          items:
            $ref: '#/components/schemas/store.AlertMute'
      required:
        - mutes
    httpapi.alertRule:
      type: object
      properties:
        description:
          type: string
        description_ru:
          type: string
        expr:
          type: string
        for:
          type: string
        group:
          type: string
        name:
          type: string
        severity:
          type: string
        state:
          type: string
      required:
        - description
        - expr
        - for
        - group
        - name
        - severity
        - state
    httpapi.alertRulesResp:
      type: object
      properties:
        rules:
          type:
            - array
            - "null"
          items:
            $ref: '#/components/schemas/httpapi.alertRule'
      required:
        - rules
    httpapi.apiError:
      type: object
