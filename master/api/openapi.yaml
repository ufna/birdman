  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'birdman API key (bmk_…) in `Authorization: Bearer`. A key carries scopes (admin, deploy, matchmaking, allocate, readonly) and may be bound to one (project, environment) pair, outside of which it can reach nothing.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: birdman_session
      description: Browser session cookie issued by POST /v1/session; the panel uses it instead of carrying an API key in every request.
